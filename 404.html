<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 · Страница не найдена · Kapitanych</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg: #0a0a0b;
    --surface: rgba(255,255,255,0.045);
    --surface-hover: rgba(255,255,255,0.075);
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.16);
    --text: #f5f5f7;
    --text-dim: #a1a1aa;
    --text-faint: #6b6b72;
    --accent: #7c6cff;
    --accent-soft: rgba(124,108,255,0.16);
    --accent-text: #c9c2ff;
    --ease: cubic-bezier(0.22,1,0.36,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%;}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    position:relative;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--accent);color:#fff;}
  button{font-family:inherit;}

  .bg{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    background:var(--bg);
  }
  .bg-blob{
    position:absolute; border-radius:50%; filter:blur(90px);
    opacity:0.55;
  }
  .bg-blob.a{
    width:640px; height:640px; top:-220px; left:-160px;
    background:radial-gradient(circle at 30% 30%, rgba(124,108,255,0.55), transparent 70%);
    animation: floatBlob 22s ease-in-out infinite;
  }
  .bg-blob.b{
    width:560px; height:560px; top:-80px; right:-220px;
    background:radial-gradient(circle at 60% 40%, rgba(66,58,145,0.4), transparent 70%);
    animation: floatBlob 26s ease-in-out infinite reverse;
  }
  .bg-blob.c{
    width:520px; height:520px; bottom:-260px; left:30%;
    background:radial-gradient(circle at 50% 50%, rgba(124,108,255,0.22), transparent 70%);
    animation: floatBlob 30s ease-in-out infinite;
  }
  @keyframes floatBlob{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(30px,40px) scale(1.06); }
  }

  .error-container{
    position:relative;
    z-index:1;
    text-align:center;
    padding:20px;
    max-width:600px;
  }

  .error-code{
    font-size:clamp(8rem, 20vw, 14rem);
    font-weight:800;
    letter-spacing:-0.05em;
    line-height:1;
    margin-bottom:20px;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeInUp 0.8s var(--ease);
  }

  .error-title{
    font-size:1.8rem;
    font-weight:700;
    margin-bottom:12px;
    animation: fadeInUp 0.8s var(--ease) 0.2s both;
  }

  .error-text{
    color:var(--text-dim);
    font-size:1rem;
    line-height:1.6;
    margin-bottom:40px;
    animation: fadeInUp 0.8s var(--ease) 0.4s both;
  }

  .error-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    animation: fadeInUp 0.8s var(--ease) 0.6s both;
  }

  .btn{
    position:relative;
    display:inline-flex; align-items:center; gap:8px;
    padding:14px 24px; border-radius:100px;
    font-size:0.92rem; font-weight:600; text-decoration:none;
    cursor:pointer; border:1px solid transparent;
    overflow:hidden; isolation:isolate;
    transition: transform 260ms var(--ease), background 260ms var(--ease), box-shadow 260ms var(--ease), border-color 260ms var(--ease);
  }
  .btn::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:radial-gradient(90px 90px at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.35), transparent 70%);
    opacity:0; transition:opacity 320ms var(--ease);
  }
  .btn:hover::before{ opacity:1; }
  .btn:active{ transform:scale(0.97); }
  
  .btn-primary{
    background:var(--text); color:#0a0a0b;
    box-shadow:0 0 0 0 rgba(124,108,255,0);
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 14px 32px -12px rgba(255,255,255,0.25); }
  .btn-primary::before{ background:radial-gradient(90px 90px at var(--mx,50%) var(--my,50%), rgba(124,108,255,0.45), transparent 70%); }
  
  .btn-ghost{
    background:var(--surface); color:var(--text); border-color:var(--border);
  }
  .btn-ghost:hover{ background:var(--surface-hover); border-color:var(--border-hover); transform:translateY(-2px); }

  .lang-btn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:10;
    background:transparent; 
    border:1px solid var(--border); 
    color:var(--text-dim);
    font-size:0.78rem; font-weight:600; 
    padding:8px 12px; 
    border-radius:100px;
    cursor:pointer; 
    transition: all 220ms var(--ease);
    backdrop-filter:blur(10px);
    background:rgba(15,15,18,0.55);
  }
  .lang-btn:hover{ color:var(--text); border-color:var(--border-hover); }

  @keyframes fadeInUp{
    from{
      opacity:0;
      transform:translateY(30px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  @media (max-width:560px){
    .error-code{ font-size:6rem; }
    .error-title{ font-size:1.4rem; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="bg-blob a"></div>
  <div class="bg-blob b"></div>
  <div class="bg-blob c"></div>
</div>

<button class="lang-btn" id="lang-toggle">EN</button>

<div class="error-container">
  <div class="error-code">404</div>
  <div class="error-title" data-i18n="error_title">Страница не найдена</div>
  <div class="error-text" data-i18n="error_text">Кажется, вы забрели не туда. Страница, которую вы ищете, не существует или была перемещена.</div>
  <div class="error-actions">
    <a href="/" class="btn btn-primary" data-i18n="back_home">← Вернуться на главную</a>
    <a href="https://twitch.tv/kapitanych_" target="_blank" class="btn btn-ghost" data-i18n="go_twitch">Перейти на Twitch</a>
  </div>
</div>

<script>
(function(){
  const translations = {
    ru: {
      error_title: 'Страница не найдена',
      error_text: 'Кажется, вы забрели не туда. Страница, которую вы ищете, не существует или была перемещена.',
      back_home: '← Вернуться на главную',
      go_twitch: 'Перейти на Twitch'
    },
    en: {
      error_title: 'Page not found',
      error_text: 'It seems you\'ve wandered into the wrong place. The page you\'re looking for doesn\'t exist or has been moved.',
      back_home: '← Back to home',
      go_twitch: 'Go to Twitch'
    }
  };

  let currentLang = localStorage.getItem('preferredLang') || 'ru';

  function applyLanguage(lang){
    currentLang = lang;
    localStorage.setItem('preferredLang', lang);

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });

    document.getElementById('lang-toggle').textContent = lang === 'ru' ? 'EN' : 'RU';
    document.documentElement.lang = lang;
    document.title = lang === 'ru' ? '404 · Страница не найдена · Kapitanych' : '404 · Page not found · Kapitanych';
  }

  applyLanguage(currentLang);

  document.getElementById('lang-toggle').addEventListener('click', () => {
    applyLanguage(currentLang === 'ru' ? 'en' : 'ru');
  });
})();
</script>
</body>
</html>
