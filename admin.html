<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления ботом Kapitanych</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #101014;
            --surface: #1a1a20;
            --surface-hover: #23232b;
            --border: rgba(255, 255, 255, 0.06);
            --text: #eaeaea;
            --text-dim: #9b9ba6;
            --twitch: #9146ff;
            --twitch-hover: #a970ff;
            --accent-soft: rgba(145, 70, 255, 0.15);
            --danger: #ff4f4f;
            --danger-soft: rgba(255, 79, 79, 0.15);
            --sidebar-width: 250px;
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ---------- Модалка входа (поверх всего) ---------- */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .auth-modal {
            width: min(90%, 400px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .auth-modal h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #c28eff, #9146ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #9146ff, #772ce8);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(145, 70, 255, 0.3);
        }

        .auth-btn:hover {
            background: linear-gradient(135deg, #a970ff, #9146ff);
            transform: translateY(-2px);
        }

        .auth-hint {
            margin-top: 16px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        /* ---------- Основной макет (сайдбар + контент) ---------- */
        .app-layout {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: rgba(22, 22, 28, 0.8);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .sidebar-header {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 32px;
            padding-left: 12px;
            letter-spacing: -0.02em;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .nav-item.active,
        .nav-item:hover {
            background: var(--surface-hover);
            color: #fff;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }

        .nav-item.active svg,
        .nav-item:hover svg {
            opacity: 1;
        }

        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            background: rgba(16, 16, 20, 0.6);
            backdrop-filter: blur(4px);
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #43b581;
            box-shadow: 0 0 8px #43b581;
        }

        .status-dot.offline {
            background: #ff4f4f;
            box-shadow: 0 0 8px #ff4f4f;
        }

        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: #fff;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        input {
            flex: 1 1 200px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: var(--twitch);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: var(--twitch);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: var(--twitch-hover);
            transform: translateY(-1px);
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        button.secondary:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        button.danger {
            background: var(--danger-soft);
            color: #ff8a8a;
            border: 1px solid rgba(255,79,79,0.2);
        }

        button.danger:hover {
            background: var(--danger);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .response-text {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 8px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                bottom: 0;
                top: auto;
                height: auto;
                flex-direction: row;
                overflow-x: auto;
                border-right: none;
                border-top: 1px solid var(--border);
                background: var(--surface);
                padding: 12px;
                z-index: 50;
            }
            .main-content {
                padding: 16px;
            }
            .sidebar-header {
                display: none;
            }
            .nav-item {
                margin-bottom: 0;
                margin-right: 8px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Модалка входа через Twitch -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-modal">
            <h1>Вход</h1>
            <a id="twitch-login-btn" class="auth-btn" href="#">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
                Войти через Twitch
            </a>
            <p class="auth-hint">Авторизуйтесь под разрешённым аккаунтом</p>
        </div>
    </div>

    <!-- Основной макет (скрыт до входа) -->
    <div id="app-layout" class="app-layout hidden">
        <!-- Сайдбар -->
        <aside class="sidebar">
            <div class="sidebar-header">Kapitanych</div>
            <nav>
                <a class="nav-item active" data-section="commands">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                    Команды
                </a>
                <!-- В будущем здесь появятся другие пункты -->
            </nav>
            <div style="margin-top: auto;">
                <button class="secondary" onclick="logout()" style="width:100%;">Выйти</button>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <div class="status-bar">
                <span id="status-dot" class="status-dot"></span>
                <span id="bot-status-text">Подключение...</span>
            </div>

            <!-- Секция отправки сообщения -->
            <div class="section">
                <h2>Отправить сообщение в чат</h2>
                <div class="input-row">
                    <input id="message-input" type="text" placeholder="Текст сообщения...">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
                <p id="msg-response" class="response-text"></p>
            </div>

            <!-- Секция управления командами -->
            <div class="section" id="commands-section">
                <h2>Кастомные команды</h2>
                <div class="input-row">
                    <input id="new-trigger" type="text" placeholder="!команда">
                    <input id="new-response" type="text" placeholder="Ответ бота">
                    <button onclick="addCommand()">Добавить</button>
                </div>
                <p id="cmd-response" class="response-text"></p>

                <table id="commands-table">
                    <thead>
                        <tr><th>Триггер</th><th>Ответ</th><th style="width:100px"></th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://kapitanych-bot.onrender.com';
        const CLIENT_ID = 'pru9mgfjmldbtxhhszlkto10krnvj2';
        const REDIRECT_URI = 'https://multivarka01.github.io/kapitanych/twitch-auth.html';

        // Настройка ссылки входа
        document.getElementById('twitch-login-btn').href =
            `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;

        let jwt = localStorage.getItem('jwt');

        // Проверяем токен при загрузке
        if (jwt) {
            fetch(`${API_URL}/api/status`, { headers: { Authorization: `Bearer ${jwt}` } })
                .then(res => res.ok ? showApp() : (localStorage.removeItem('jwt'), showLogin()))
                .catch(() => showLogin());
        } else {
            showLogin();
        }

        function showApp() {
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            checkStatus();
            loadCommands();
        }

        function showLogin() {
            document.getElementById('auth-overlay').classList.remove('hidden');
            document.getElementById('app-layout').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('jwt');
            jwt = null;
            showLogin();
        }

        // ---------- API хелпер ----------
        function apiCall(method, path, body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${jwt}` } };
            if (body) opts.body = JSON.stringify(body);
            return fetch(`${API_URL}${path}`, opts).then(r => r.json());
        }

        // ---------- Статус бота ----------
        async function checkStatus() {
            try {
                const data = await apiCall('GET', '/api/status');
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('bot-status-text');
                if (data.connected) {
                    dot.className = 'status-dot';
                    text.textContent = 'Бот онлайн';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = 'Бот офлайн';
                }
            } catch(e) {
                document.getElementById('bot-status-text').textContent = 'Ошибка';
            }
        }

        // ---------- Отправка сообщения ----------
        function sendMessage() {
            const msg = document.getElementById('message-input').value;
            apiCall('POST', '/api/send-message', { message: msg })
                .then(d => {
                    document.getElementById('msg-response').textContent = d.success ? '✅ Сообщение отправлено' : '❌ ' + (d.error || 'Ошибка');
                    document.getElementById('message-input').value = '';
                });
        }

        // ---------- Управление командами ----------
        async function loadCommands() {
            const commands = await apiCall('GET', '/api/commands');
            const tbody = document.querySelector('#commands-table tbody');
            tbody.innerHTML = '';
            commands.forEach(cmd => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${cmd.trigger}</strong></td>
                    <td>${cmd.response}</td>
                    <td><button class="danger" onclick="deleteCommand('${cmd.trigger}')">Удалить</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addCommand() {
            const trigger = document.getElementById('new-trigger').value.trim();
            const response = document.getElementById('new-response').value.trim();
            if (!trigger || !response) return;
            apiCall('POST', '/api/commands', { trigger, response })
                .then(d => {
                    if (d.success) {
                        document.getElementById('new-trigger').value = '';
                        document.getElementById('new-response').value = '';
                        loadCommands();
                    } else {
                        document.getElementById('cmd-response').textContent = '❌ ' + (d.error || 'Ошибка');
                    }
                });
        }

        async function deleteCommand(trigger) {
            await apiCall('DELETE', `/api/commands/${trigger}`);
            loadCommands();
        }

        // Обработчик кликов по меню (пока только "Команды")
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                // В будущем можно скрывать/показывать секции
            });
        });
    </script>
</body>
</html>
