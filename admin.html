<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления ботом Kapitanych</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e0e10;
            --surface: rgba(20, 20, 22, 0.92);
            --surface-light: rgba(30, 30, 35, 0.85);
            --border: rgba(255, 255, 255, 0.07);
            --text: #efeff1;
            --text-dim: #adadb8;
            --twitch: #9146ff;
            --twitch-hover: #a970ff;
            --accent-soft: rgba(145, 70, 255, 0.15);
            --danger: #ff4f4f;
            --danger-soft: rgba(255, 79, 79, 0.15);
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 30% 10%, rgba(145, 70, 255, 0.08), transparent 40%),
                        radial-gradient(circle at 70% 80%, rgba(145, 70, 255, 0.06), transparent 40%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            backdrop-filter: blur(4px);
        }

        /* ---------- Модальное окно (вход) ---------- */
        .auth-modal {
            width: min(100%, 420px);
            padding: 32px 28px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: linear-gradient(160deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%),
                        var(--surface);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(145, 70, 255, 0.08);
            backdrop-filter: blur(16px);
            text-align: center;
        }

        .auth-modal h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #c28eff, #9146ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #9146ff, #772ce8);
            color: white;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(145, 70, 255, 0.3);
            text-decoration: none;
        }

        .auth-btn:hover {
            background: linear-gradient(135deg, #a970ff, #9146ff);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(145, 70, 255, 0.45);
        }

        .auth-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .auth-hint {
            margin-top: 20px;
            color: var(--text-dim);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* ---------- Панель управления (скрыта до входа) ---------- */
        .admin-panel {
            display: none;
            width: min(100%, 900px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .admin-panel.visible {
            display: block;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #43b581;
            box-shadow: 0 0 8px #43b581;
        }

        .status-dot.offline {
            background: #ff4f4f;
            box-shadow: 0 0 8px #ff4f4f;
        }

        h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.4rem;
            margin: 32px 0 16px;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        input {
            flex: 1 1 200px;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: var(--twitch);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        button {
            padding: 14px 24px;
            border-radius: 14px;
            border: none;
            background: var(--twitch);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: var(--twitch-hover);
            transform: translateY(-1px);
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        button.secondary:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        button.danger {
            background: var(--danger-soft);
            color: #ff8a8a;
            border: 1px solid rgba(255,79,79,0.2);
        }

        button.danger:hover {
            background: var(--danger);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .response-text {
            font-size: 0.9rem;
            margin-top: 8px;
            color: var(--text-dim);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Модальное окно входа -->
    <div id="auth-modal" class="auth-modal">
        <h1>Вход</h1>
        <a id="twitch-login-btn" class="auth-btn" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
            Войти через Twitch
        </a>
        <p class="auth-hint">Необходимо авторизоваться под аккаунтом, которому разрешён доступ к панели управления.</p>
    </div>

    <!-- Панель управления (скрыта) -->
    <div id="admin-panel" class="admin-panel">
        <div class="status-row">
            <span id="status-dot" class="status-dot"></span>
            <span id="bot-status-text">Подключение...</span>
        </div>

        <h2>📨 Отправить сообщение в чат</h2>
        <div class="input-row">
            <input id="message-input" type="text" placeholder="Текст сообщения...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
        <p id="msg-response" class="response-text"></p>

        <h2>⚡ Кастомные команды</h2>
        <div class="input-row">
            <input id="new-trigger" type="text" placeholder="!команда">
            <input id="new-response" type="text" placeholder="Ответ бота">
            <button onclick="addCommand()">Добавить</button>
        </div>
        <p id="cmd-response" class="response-text"></p>

        <table id="commands-table">
            <thead>
                <tr><th>Триггер</th><th>Ответ</th><th style="width:100px"></th></tr>
            </thead>
            <tbody></tbody>
        </table>

        <div style="margin-top: 32px; display: flex; gap: 12px; justify-content: flex-end;">
            <button class="secondary" onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://kapitanych-bot.onrender.com';
        const CLIENT_ID = 'pru9mgfjmldbtxhhszlkto10krnvj2';
        const REDIRECT_URI = 'https://multivarka01.github.io/kapitanych/twitch-auth.html';

        // Привязываем ссылку входа
        document.getElementById('twitch-login-btn').href =
            `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;

        let jwt = localStorage.getItem('jwt');

        function showAdminPanel() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('admin-panel').classList.add('visible');
            checkStatus();
            loadCommands();
        }

        function showLogin() {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('admin-panel').classList.remove('visible');
        }

        // При загрузке проверяем токен
        if (jwt) {
            fetch(`${API_URL}/api/status`, { headers: { Authorization: `Bearer ${jwt}` } })
                .then(res => res.ok ? showAdminPanel() : (localStorage.removeItem('jwt'), showLogin()))
                .catch(() => showLogin());
        } else {
            showLogin();
        }

        function apiCall(method, path, body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${jwt}` } };
            if (body) opts.body = JSON.stringify(body);
            return fetch(`${API_URL}${path}`, opts).then(r => r.json());
        }

        async function checkStatus() {
            try {
                const data = await apiCall('GET', '/api/status');
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('bot-status-text');
                if (data.connected) {
                    dot.className = 'status-dot';
                    text.textContent = 'Бот онлайн';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = 'Бот офлайн';
                }
            } catch(e) {}
        }

        function sendMessage() {
            const msg = document.getElementById('message-input').value;
            apiCall('POST', '/api/send-message', { message: msg })
                .then(d => {
                    document.getElementById('msg-response').textContent = d.success ? '✅ Сообщение отправлено' : '❌ ' + (d.error || 'Ошибка');
                    document.getElementById('message-input').value = '';
                });
        }

        async function loadCommands() {
            const commands = await apiCall('GET', '/api/commands');
            const tbody = document.querySelector('#commands-table tbody');
            tbody.innerHTML = '';
            commands.forEach(cmd => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${cmd.trigger}</strong></td>
                    <td>${cmd.response}</td>
                    <td><button class="danger" onclick="deleteCommand('${cmd.trigger}')">Удалить</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addCommand() {
            const trigger = document.getElementById('new-trigger').value.trim();
            const response = document.getElementById('new-response').value.trim();
            if (!trigger || !response) return;
            apiCall('POST', '/api/commands', { trigger, response })
                .then(d => {
                    if (d.success) {
                        document.getElementById('new-trigger').value = '';
                        document.getElementById('new-response').value = '';
                        loadCommands();
                    } else {
                        document.getElementById('cmd-response').textContent = '❌ ' + (d.error || 'Ошибка');
                    }
                });
        }

        async function deleteCommand(trigger) {
            await apiCall('DELETE', `/api/commands/${trigger}`);
            loadCommands();
        }

        function logout() {
            localStorage.removeItem('jwt');
            jwt = null;
            showLogin();
        }
    </script>
</body>
</html>
