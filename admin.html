<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitanych · Bot Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #101014;
            --sidebar-bg: #141418;
            --card-bg: #1a1a1f;
            --border: #27272a;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --twitch: #9146ff;
            --twitch-hover: #a970ff;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: var(--text-dim);
            font-size: 1.2rem;
            font-weight: 500;
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .auth-modal {
            width: min(90%, 400px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }

        .auth-modal h1 { font-size: 2rem; font-weight: 700; margin-bottom: 24px; color: #fff; }

        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            background: var(--twitch);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 14px rgba(145, 70, 255, 0.25);
        }

        .auth-btn:hover { background: var(--twitch-hover); transform: translateY(-1px); }
        .auth-hint { margin-top: 18px; color: var(--text-dim); font-size: 0.85rem; }

        .app-layout { display: flex; width: 100%; height: 100vh; }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 16px;
            flex-shrink: 0;
        }

        .sidebar-header { font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: -0.03em; margin-bottom: 32px; padding-left: 12px; display: flex; align-items: center; gap: 10px; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.15s;
            cursor: pointer;
        }
        .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .nav-item.active { background: rgba(255,255,255,0.06); color: #fff; }
        .nav-item svg { width: 20px; height: 20px; opacity: 0.8; }
        .nav-item.active svg { opacity: 1; }

        .sidebar-footer { margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px; }
        .sidebar-footer button {
            width: 100%;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .sidebar-footer button:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .main-content { flex: 1; padding: 36px 40px; overflow-y: auto; background: var(--bg); }
        .status-row { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; font-weight: 500; font-size: 0.95rem; color: var(--text-dim); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .status-dot.offline { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 24px; margin-bottom: 24px; }
        .card h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; color: #fff; letter-spacing: -0.02em; }

        .input-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        input, textarea { flex: 1 1 200px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: #18181b; color: var(--text); font: inherit; outline: none; transition: border 0.2s; }
        input:focus, textarea:focus { border-color: var(--twitch); box-shadow: 0 0 0 3px rgba(145, 70, 255, 0.12); }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: var(--twitch);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
            font-family: inherit;
        }
        button:hover { background: var(--twitch-hover); }
        button.danger { background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
        button.danger:hover { background: var(--danger); border-color: var(--danger); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-dim); font-weight: 500; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }

        .hidden { display: none !important; }
        .response-text { font-size: 0.85rem; margin-top: 10px; color: var(--text-dim); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); padding: 16px; align-items: center; gap: 12px; }
            .sidebar-header { margin-bottom: 0; flex: 1; }
            .sidebar-nav { flex-direction: row; gap: 8px; }
            .sidebar-footer { margin-top: 0; border-top: none; padding-top: 0; margin-left: auto; }
            .main-content { padding: 20px; }
            .app-layout { flex-direction: column; }
        }
    </style>
</head>
<body>

<div id="loading-screen">Loading...</div>

<div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-modal">
        <h1>Sign in</h1>
        <a id="twitch-login-btn" class="auth-btn" href="#">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
            Sign in with Twitch
        </a>
        <p class="auth-hint">Authorize with a permitted account</p>
    </div>
</div>

<div id="app-layout" class="app-layout hidden">
    <aside class="sidebar">
        <div class="sidebar-header"><span>⚡</span> Kapitanych</div>
        <nav class="sidebar-nav">
            <a class="nav-item active" data-tab="dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                Dashboard
            </a>
            <a class="nav-item" data-tab="predictions">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                Predictions
            </a>
            <a class="nav-item" data-tab="commands">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                Commands
            </a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="logout()">Log out</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="status-row">
            <span id="status-dot" class="status-dot"></span>
            <span id="bot-status-text">Checking status...</span>
        </div>

        <!-- Dashboard -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="card">
                <h2>Send message to chat</h2>
                <div class="input-row">
                    <input id="message-input" type="text" placeholder="Message text...">
                    <button onclick="sendMessage()">Send</button>
                </div>
                <p id="msg-response" class="response-text"></p>
            </div>
            <div class="card">
                <h2>Live chat</h2>
                <div id="chat-box" style="max-height:300px;overflow-y:auto;background:#18181b;border-radius:12px;padding:12px;font-size:0.9rem;">
                    <span id="chat-empty">No messages yet</span>
                </div>
            </div>
        </div>

        <!-- Predictions -->
        <div id="tab-predictions" class="tab-content">
            <div class="card">
                <h2>Create Prediction</h2>
                <div class="input-row">
                    <input id="pred-title" type="text" placeholder="Who will win?">
                    <input id="pred-outcome1" type="text" placeholder="Outcome 1 (e.g., Yes)" value="Yes">
                    <input id="pred-outcome2" type="text" placeholder="Outcome 2 (e.g., No)" value="No">
                    <button onclick="createPrediction()">Create</button>
                </div>
                <div class="input-row">
                    <input id="pred-duration" type="number" placeholder="Duration (sec)" value="120" style="width:100px">
                </div>
                <p id="pred-response" class="response-text"></p>
            </div>
            <div class="card">
                <h2>Active Prediction</h2>
                <p id="active-pred-info">No active prediction</p>
                <div class="input-row">
                    <button onclick="repeatPrediction()">Repeat Last</button>
                    <select id="winning-outcome" style="padding:10px;border-radius:10px;background:#18181b;color:white;border:1px solid var(--border)">
                        <option value="">-- Choose winner --</option>
                    </select>
                    <button onclick="resolvePrediction()">Resolve</button>
                </div>
            </div>
        </div>

        <!-- Commands -->
        <div id="tab-commands" class="tab-content">
            <div class="card">
                <h2>Add command</h2>
                <div class="input-row">
                    <input id="new-trigger" type="text" placeholder="!command">
                    <input id="new-response" type="text" placeholder="Response">
                    <label style="display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 0.9rem;">
                        <input type="checkbox" id="new-reply"> Reply
                    </label>
                    <button onclick="addCommand()">Add</button>
                </div>
                <p id="cmd-response" class="response-text"></p>
                <h2 style="margin-top: 24px;">All commands</h2>
                <table id="commands-table">
                    <thead><tr><th>Trigger</th><th>Response</th><th>Reply</th><th style="width:80px"></th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    (function() {
        const API_URL = 'https://kapitanych-bot.onrender.com';
        const CLIENT_ID = 'pru9mgfjmldbtxhhszlkto10krnvj2';
        const REDIRECT_URI = 'https://multivarka01.github.io/kapitanych/twitch-auth.html';

        document.getElementById('twitch-login-btn').href =
            `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;

        let jwt = localStorage.getItem('jwt');

        const loadingScreen = document.getElementById('loading-screen');
        const authOverlay = document.getElementById('auth-overlay');
        const appLayout = document.getElementById('app-layout');

        async function initialCheck() {
            if (!jwt) {
                loadingScreen.classList.add('hidden');
                authOverlay.classList.remove('hidden');
                return;
            }
            try {
                const res = await fetch(`${API_URL}/api/status`, { headers: { Authorization: `Bearer ${jwt}` } });
                if (res.ok) {
                    loadingScreen.classList.add('hidden');
                    appLayout.classList.remove('hidden');
                    initDashboard();
                } else {
                    localStorage.removeItem('jwt');
                    jwt = null;
                    loadingScreen.classList.add('hidden');
                    authOverlay.classList.remove('hidden');
                }
            } catch (e) {
                loadingScreen.classList.add('hidden');
                authOverlay.classList.remove('hidden');
            }
        }

        function apiCall(method, path, body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${jwt}` } };
            if (body) opts.body = JSON.stringify(body);
            return fetch(`${API_URL}${path}`, opts).then(r => r.json());
        }

        async function checkStatus() {
            try {
                const d = await apiCall('GET', '/api/status');
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('bot-status-text');
                if (d.connected) {
                    dot.className = 'status-dot';
                    text.textContent = 'Bot online';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = 'Bot offline';
                }
            } catch(e) {}
        }

        window.sendMessage = function() {
            const input = document.getElementById('message-input');
            const msg = input.value.trim();
            if (!msg) return;
            apiCall('POST', '/api/send-message', { message: msg })
                .then(d => {
                    document.getElementById('msg-response').textContent = d.success ? '✅ Sent' : '❌ ' + (d.error || 'Error');
                    input.value = '';
                });
        };

        // Commands
        async function loadCommands() {
            const commands = await apiCall('GET', '/api/commands');
            const tbody = document.querySelector('#commands-table tbody');
            tbody.innerHTML = '';
            commands.forEach(cmd => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${cmd.trigger}</strong></td>
                    <td>${cmd.response}</td>
                    <td>${cmd.reply ? '✅' : '—'}</td>
                    <td><button class="danger" onclick="deleteCommand('${cmd.trigger}')">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.addCommand = function() {
            const trigger = document.getElementById('new-trigger').value.trim();
            const response = document.getElementById('new-response').value.trim();
            const reply = document.getElementById('new-reply').checked;
            if (!trigger || !response) return;
            apiCall('POST', '/api/commands', { trigger, response, reply })
                .then(d => {
                    if (d.success) {
                        document.getElementById('new-trigger').value = '';
                        document.getElementById('new-response').value = '';
                        document.getElementById('new-reply').checked = false;
                        loadCommands();
                    } else {
                        document.getElementById('cmd-response').textContent = '❌ ' + (d.error || 'Error');
                    }
                });
        };

        window.deleteCommand = async function(trigger) {
            await apiCall('DELETE', `/api/commands/${trigger}`);
            loadCommands();
        };

        // Chat
        async function loadChat() {
            try {
                const messages = await apiCall('GET', '/api/chat');
                const box = document.getElementById('chat-box');
                const empty = document.getElementById('chat-empty');
                if (messages.length === 0) {
                    box.innerHTML = '<span id="chat-empty">No messages yet</span>';
                    return;
                }
                let html = '';
                messages.forEach(m => {
                    const time = new Date(m.timestamp).toLocaleTimeString();
                    html += `<div class="chat-message" style="margin-bottom:6px;"><span style="color:var(--twitch);font-weight:600">${m.user}</span> <span style="color:var(--text-dim);font-size:0.75rem;">${time}</span><br>${m.message}</div>`;
                });
                box.innerHTML = html;
            } catch(e) {}
        }

        // Predictions UI
        async function loadActivePrediction() {
            try {
                // Здесь можно запросить /api/active-prediction, но пока просто заглушка
                // Для полной реализации можно добавить эндпоинт.
            } catch(e) {}
        }

        window.createPrediction = async function() {
            const title = document.getElementById('pred-title').value.trim();
            const outcome1 = document.getElementById('pred-outcome1').value.trim() || 'Yes';
            const outcome2 = document.getElementById('pred-outcome2').value.trim() || 'No';
            const duration = parseInt(document.getElementById('pred-duration').value) || 120;
            if (!title) {
                document.getElementById('pred-response').textContent = 'Enter title';
                return;
            }
            // Используем API, который мы добавим
            const res = await apiCall('POST', '/api/predictions/create', { title, outcomes: [outcome1, outcome2], duration });
            if (res.success) {
                document.getElementById('pred-response').textContent = 'Prediction created!';
                loadActivePrediction();
            } else {
                document.getElementById('pred-response').textContent = res.error || 'Error';
            }
        };

        window.repeatPrediction = async function() {
            const res = await apiCall('POST', '/api/predictions/repeat');
            document.getElementById('pred-response').textContent = res.success ? 'Repeated!' : (res.error || 'Error');
        };

        window.resolvePrediction = async function() {
            const winning = document.getElementById('winning-outcome').value;
            if (!winning) return;
            const res = await apiCall('POST', '/api/predictions/resolve', { winning_outcome: winning });
            document.getElementById('pred-response').textContent = res.success ? 'Resolved!' : (res.error || 'Error');
        };

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-tab=${tabName}]`).classList.add('active');
        }

        function initDashboard() {
            checkStatus();
            loadCommands();
            loadChat();
            setInterval(loadChat, 10000);

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchTab(item.dataset.tab);
                });
            });
        }

        window.logout = function() {
            localStorage.removeItem('jwt');
            jwt = null;
            appLayout.classList.add('hidden');
            authOverlay.classList.remove('hidden');
        };

        initialCheck();
    })();
</script>
</body>
</html>
