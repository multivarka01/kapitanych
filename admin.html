<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления ботом Kapitanych</title>
  <style>
    body { background: #1a1a1a; color: #fff; font-family: monospace; padding: 2rem; }
    .hidden { display: none; }
    #admin-panel { margin-top: 2rem; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
    button:hover { background: #444; }
    input { padding: 8px; margin: 4px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #444; padding: 8px; text-align: left; }
    th { background: #333; }
    .login-btn { background: #9146ff; color: white; font-weight: bold; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
  <div id="login-section">
    <h1>Вход через Twitch</h1>
    <a class="login-btn" id="twitch-login-btn" href="#">Войти через Twitch</a>
  </div>

  <div id="admin-panel" class="hidden">
    <h2>Панель управления</h2>
    <p>Статус бота: <span id="bot-status">...</span></p>
    
    <h3>Отправить сообщение в чат</h3>
    <input type="text" id="message-input" placeholder="Текст сообщения" style="width:300px;">
    <button onclick="sendMessage()">Отправить</button>
    <span id="msg-response"></span>

    <h3>Кастомные команды</h3>
    <div>
      <input type="text" id="new-trigger" placeholder="!команда" style="width:150px;">
      <input type="text" id="new-response" placeholder="Ответ бота" style="width:300px;">
      <button onclick="addCommand()">Добавить команду</button>
    </div>
    <span id="cmd-response"></span>
    
    <table id="commands-table">
      <thead><tr><th>Триггер</th><th>Ответ</th><th>Действие</th></tr></thead>
      <tbody></tbody>
    </table>

    <button onclick="logout()">Выйти</button>
  </div>

  <script>
    const API_URL = 'https://kapitanych-bot.onrender.com'; // замени на актуальный URL Render
    const CLIENT_ID = 'pru9mgfjmldbtxhhszlkto10krnvj2'; // твой Client ID
    const REDIRECT_URI = 'https://multivarka01.github.io/kapitanych/twitch-auth.html'; // страница-ловушка

    // Генерация ссылки для входа через Twitch
    document.getElementById('twitch-login-btn').href = 
      `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;

    let jwt = localStorage.getItem('jwt');

    function showAdminPanel() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('admin-panel').classList.remove('hidden');
      checkStatus();
      loadCommands();
    }

    function showLogin() {
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('admin-panel').classList.add('hidden');
    }

    // Проверка токена при загрузке страницы
    if (jwt) {
      fetch(`${API_URL}/api/status`, { headers: { Authorization: `Bearer ${jwt}` } })
        .then(res => res.ok ? showAdminPanel() : (localStorage.removeItem('jwt'), showLogin()))
        .catch(() => showLogin());
    } else {
      showLogin();
    }

    function apiCall(method, path, body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${jwt}` } };
      if (body) opts.body = JSON.stringify(body);
      return fetch(`${API_URL}${path}`, opts).then(r => r.json());
    }

    function checkStatus() {
      apiCall('GET', '/api/status').then(d => {
        document.getElementById('bot-status').textContent = d.connected ? '🟢 Подключён' : '🔴 Отключён';
      });
    }

    function sendMessage() {
      const msg = document.getElementById('message-input').value;
      apiCall('POST', '/api/send-message', { message: msg })
        .then(d => {
          document.getElementById('msg-response').textContent = d.success ? '✅ Отправлено' : 'Ошибка: ' + d.error;
          document.getElementById('message-input').value = '';
        });
    }

    function loadCommands() {
      apiCall('GET', '/api/commands').then(commands => {
        const tbody = document.querySelector('#commands-table tbody');
        tbody.innerHTML = '';
        commands.forEach(cmd => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${cmd.trigger}</td><td>${cmd.response}</td>
            <td><button onclick="deleteCommand('${cmd.trigger}')">Удалить</button></td>`;
          tbody.appendChild(tr);
        });
      });
    }

    function addCommand() {
      const trigger = document.getElementById('new-trigger').value.trim();
      const response = document.getElementById('new-response').value.trim();
      if (!trigger || !response) return alert('Заполни оба поля');
      apiCall('POST', '/api/commands', { trigger, response })
        .then(d => {
          if (d.success) {
            document.getElementById('new-trigger').value = '';
            document.getElementById('new-response').value = '';
            loadCommands();
          } else {
            document.getElementById('cmd-response').textContent = 'Ошибка: ' + d.error;
          }
        });
    }

    function deleteCommand(trigger) {
      apiCall('DELETE', `/api/commands/${trigger}`).then(d => { if (d.success) loadCommands(); });
    }

    function logout() {
      localStorage.removeItem('jwt');
      jwt = null;
      showLogin();
    }
  </script>
</body>
</html>
