<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitanych · Панель управления ботом</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #101014;
            --sidebar-bg: #141418;
            --card-bg: #1a1a1f;
            --border: #27272a;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --twitch: #9146ff;
            --twitch-hover: #a970ff;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Прелоадер ---------- */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: var(--text-dim);
            font-size: 1.2rem;
            font-weight: 500;
        }

        /* ---------- Модалка входа ---------- */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .auth-modal {
            width: min(90%, 400px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }

        .auth-modal h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
            color: #fff;
        }

        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            background: var(--twitch);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 14px rgba(145, 70, 255, 0.25);
        }

        .auth-btn:hover {
            background: var(--twitch-hover);
            transform: translateY(-1px);
        }

        .auth-hint {
            margin-top: 18px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        /* ---------- Дашборд ---------- */
        .app-layout {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Сайдбар */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 16px;
            flex-shrink: 0;
        }

        .sidebar-header {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.03em;
            margin-bottom: 32px;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.15s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.04);
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            opacity: 0.8;
        }

        .nav-item:hover svg,
        .nav-item.active svg {
            opacity: 1;
        }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .sidebar-footer button {
            width: 100%;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sidebar-footer button:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            padding: 36px 40px;
            overflow-y: auto;
            background: var(--bg);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-dim);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }

        .status-dot.offline {
            background: var(--danger);
            box-shadow: 0 0 6px var(--danger);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        input, textarea {
            flex: 1 1 200px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #18181b;
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--twitch);
            box-shadow: 0 0 0 3px rgba(145, 70, 255, 0.12);
        }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: var(--twitch);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
            font-family: inherit;
        }

        button:hover {
            background: var(--twitch-hover);
        }

        button.danger {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        button.danger:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th, td {
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-dim);
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hidden {
            display: none !important;
        }

        .response-text {
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--text-dim);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                flex-wrap: wrap;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 16px;
                align-items: center;
                gap: 12px;
            }
            .sidebar-header {
                margin-bottom: 0;
                flex: 1;
            }
            .sidebar-nav {
                flex-direction: row;
                gap: 8px;
            }
            .sidebar-footer {
                margin-top: 0;
                border-top: none;
                padding-top: 0;
                margin-left: auto;
            }
            .main-content {
                padding: 20px;
            }
            .app-layout {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Прелоадер -->
    <div id="loading-screen">Загрузка...</div>

    <!-- Модалка входа через Twitch (скрыта по умолчанию) -->
    <div id="auth-overlay" class="auth-overlay hidden">
        <div class="auth-modal">
            <h1>Вход в панель</h1>
            <a id="twitch-login-btn" class="auth-btn" href="#">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
                Войти через Twitch
            </a>
            <p class="auth-hint">Необходимо авторизоваться под разрешённым аккаунтом</p>
        </div>
    </div>

    <!-- Дашборд (скрыт до успешной проверки) -->
    <div id="app-layout" class="app-layout hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span>⚡</span> Kapitanych
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="#send-message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    Сообщение
                </a>
                <a class="nav-item active" href="#commands">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                    Команды
                </a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="logout()">Выйти</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="status-row">
                <span id="status-dot" class="status-dot"></span>
                <span id="bot-status-text">Проверка статуса...</span>
            </div>

            <!-- Секция отправки сообщения -->
            <div id="send-message" class="card">
                <h2>Отправить сообщение в чат</h2>
                <div class="input-row">
                    <input id="message-input" type="text" placeholder="Текст сообщения...">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
                <p id="msg-response" class="response-text"></p>
            </div>

            <!-- Секция команд -->
            <div id="commands" class="card">
                <h2>Добавить команду</h2>
                <div class="input-row">
                    <input id="new-trigger" type="text" placeholder="!команда">
                    <input id="new-response" type="text" placeholder="Ответ бота">
                    <button onclick="addCommand()">Добавить</button>
                </div>
                <p id="cmd-response" class="response-text"></p>

                <h2 style="margin-top: 24px;">Все команды</h2>
                <table id="commands-table">
                    <thead>
                        <tr><th>Триггер</th><th>Ответ</th><th style="width:80px"></th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        (function() {
            const API_URL = 'https://kapitanych-bot.onrender.com';
            const CLIENT_ID = 'pru9mgfjmldbtxhhszlkto10krnvj2';
            const REDIRECT_URI = 'https://multivarka01.github.io/kapitanych/twitch-auth.html';

            document.getElementById('twitch-login-btn').href =
                `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;

            let jwt = localStorage.getItem('jwt');

            const loadingScreen = document.getElementById('loading-screen');
            const authOverlay = document.getElementById('auth-overlay');
            const appLayout = document.getElementById('app-layout');

            // Проверка токена при загрузке
            async function initialCheck() {
                if (!jwt) {
                    loadingScreen.classList.add('hidden');
                    authOverlay.classList.remove('hidden');
                    return;
                }
                try {
                    const res = await fetch(`${API_URL}/api/status`, {
                        headers: { Authorization: `Bearer ${jwt}` }
                    });
                    if (res.ok) {
                        loadingScreen.classList.add('hidden');
                        appLayout.classList.remove('hidden');
                        initDashboard();
                    } else {
                        localStorage.removeItem('jwt');
                        jwt = null;
                        loadingScreen.classList.add('hidden');
                        authOverlay.classList.remove('hidden');
                    }
                } catch (e) {
                    loadingScreen.classList.add('hidden');
                    authOverlay.classList.remove('hidden');
                }
            }

            function initDashboard() {
                checkStatus();
                loadCommands();

                // Подсветка активного пункта меню при скролле
                const sections = document.querySelectorAll('.card');
                const navItems = document.querySelectorAll('.nav-item');

                window.addEventListener('scroll', () => {
                    let current = '';
                    sections.forEach(section => {
                        const sectionTop = section.offsetTop;
                        if (scrollY >= sectionTop - 100) {
                            current = section.getAttribute('id');
                        }
                    });
                    navItems.forEach(item => {
                        item.classList.remove('active');
                        if (item.getAttribute('href') === `#${current}`) {
                            item.classList.add('active');
                        }
                    });
                });
            }

            window.logout = function() {
                localStorage.removeItem('jwt');
                jwt = null;
                appLayout.classList.add('hidden');
                authOverlay.classList.remove('hidden');
            };

            function apiCall(method, path, body = null) {
                const opts = { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${jwt}` } };
                if (body) opts.body = JSON.stringify(body);
                return fetch(`${API_URL}${path}`, opts).then(r => r.json());
            }

            async function checkStatus() {
                try {
                    const d = await apiCall('GET', '/api/status');
                    const dot = document.getElementById('status-dot');
                    const text = document.getElementById('bot-status-text');
                    if (d.connected) {
                        dot.className = 'status-dot';
                        text.textContent = 'Бот онлайн';
                    } else {
                        dot.className = 'status-dot offline';
                        text.textContent = 'Бот офлайн';
                    }
                } catch(e) {
                    document.getElementById('bot-status-text').textContent = 'Не удалось получить статус';
                }
            }

            window.sendMessage = function() {
                const input = document.getElementById('message-input');
                const msg = input.value.trim();
                if (!msg) return;
                apiCall('POST', '/api/send-message', { message: msg })
                    .then(d => {
                        document.getElementById('msg-response').textContent = d.success ? '✅ Сообщение отправлено' : '❌ ' + (d.error || 'Ошибка');
                        input.value = '';
                    });
            };

            async function loadCommands() {
                const commands = await apiCall('GET', '/api/commands');
                const tbody = document.querySelector('#commands-table tbody');
                tbody.innerHTML = '';
                commands.forEach(cmd => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${cmd.trigger}</strong></td>
                        <td>${cmd.response}</td>
                        <td><button class="danger" onclick="deleteCommand('${cmd.trigger}')">Удалить</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            window.addCommand = function() {
                const trigger = document.getElementById('new-trigger').value.trim();
                const response = document.getElementById('new-response').value.trim();
                if (!trigger || !response) return;
                apiCall('POST', '/api/commands', { trigger, response })
                    .then(d => {
                        if (d.success) {
                            document.getElementById('new-trigger').value = '';
                            document.getElementById('new-response').value = '';
                            loadCommands();
                        } else {
                            document.getElementById('cmd-response').textContent = '❌ ' + (d.error || 'Ошибка');
                        }
                    });
            };

            window.deleteCommand = async function(trigger) {
                await apiCall('DELETE', `/api/commands/${trigger}`);
                loadCommands();
            };

            initialCheck();
        })();
    </script>
</body>
</html>
