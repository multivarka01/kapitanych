<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitanych</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Inter,system-ui;
  background:#06080f;
  color:white;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* ===== BACKGROUND ===== */
.background{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 30% 30%, rgba(0,204,255,0.12), transparent 60%),
    radial-gradient(circle at 70% 70%, rgba(0,150,255,0.1), transparent 60%),
    #06080f;
}

/* ===== NEON GRID ===== */
.grid{
  position:fixed;
  inset:0;
  z-index:-1;
  background-image:
    linear-gradient(rgba(0,204,255,0.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,204,255,0.12) 1px, transparent 1px);
  background-size:50px 50px;
  animation:moveGrid 18s linear infinite;
  box-shadow:
    inset 0 0 80px rgba(0,204,255,0.15),
    0 0 120px rgba(0,204,255,0.1);
}
@keyframes moveGrid{
  0%{transform:translateY(0);}
  100%{transform:translateY(50px);}
}

/* ===== TOP NAV (добавлено стекло + скругление) ===== */
.nav{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:35px;

  background:rgba(15,18,30,0.55);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-radius:20px;
  border:1px solid rgba(0,204,255,0.25);

  box-shadow:
    0 0 30px rgba(0,204,255,0.15),
    inset 0 0 25px rgba(255,255,255,0.03);

  z-index:10;
}
.nav a{
  color:#aaa;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}
.nav a:hover{
  color:#00ccff;
  text-shadow:0 0 12px #00ccff;
}

/* ===== HERO ===== */
.hero{
  flex:1;
  padding-top:150px;
  padding-bottom:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.avatar-img{
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid #00ccff;
  box-shadow:0 0 30px #00ccff;
  margin-bottom:20px;
  object-fit:cover;
  transition:.4s;
  cursor:pointer;
}
.avatar-img:hover{
  transform:scale(1.08);
  box-shadow:0 0 60px #00ccff;
}

h1{
  font-family:Orbitron;
  font-size:52px;
  letter-spacing:4px;
  background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 25px rgba(0,204,255,0.6);
}

/* ===== MODULES ===== */
.modules{margin-top:60px;display:flex;flex-direction:column;gap:30px;}
.row{display:flex;gap:25px;justify-content:center;flex-wrap:wrap;}
.module{
  position:relative;
  padding:35px 45px;
  min-width:260px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(0,204,255,0.6);
  border-radius:16px;
  backdrop-filter:blur(10px);
  transition:.6s ease;
  cursor:pointer;
  overflow:hidden;
  opacity:0;
}
.module::before,.module::after{
  content:"";
  position:absolute;
  width:25px;
  height:25px;
  border:2px solid #00ccff;
}
.module::before{top:0;left:0;border-right:none;border-bottom:none;}
.module::after{bottom:0;right:0;border-left:none;border-top:none;}
.module h3{
  font-family:Orbitron;
  letter-spacing:3px;
  font-size:18px;
}
.module:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 0 50px #00ccff;
}

.left-start{transform:translateX(-120px);}
.right-start{transform:translateX(120px);}
.bottom-start{transform:translateY(60px);}
.show{transform:translateX(0) translateY(0);opacity:1;}

/* ===== GLASS BAR ===== */
.glass-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(10,12,20,0.7);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(0,204,255,0.3);
  padding:10px 15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  box-shadow:0 -8px 20px rgba(0,0,0,0.5);
  z-index:20;
}

.bar-button{
  background:rgba(0,204,255,0.15);
  border:1px solid rgba(0,204,255,0.6);
  border-radius:30px;
  padding:6px 18px;
  color:white;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 0 15px rgba(0,204,255,0.5);
}
.bar-button:hover{
  box-shadow:0 0 25px #00ccff;
  transform:scale(1.05);
}

.vertical-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:13px;
}

.kapitanych-text{
  font-weight:600;
  background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 15px rgba(0,204,255,0.6);
}

.multivarka-link{
  text-decoration:none;
  font-weight:700;
  background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 15px rgba(0,204,255,0.6);
  transition:.3s;
}
.multivarka-link:hover{
  text-shadow:0 0 25px #00eaff;
}

/* ===== MODAL (анимации добавлены) ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10000;
  opacity:0;
  visibility:hidden;
  transition:opacity .35s ease, visibility .35s ease;
}
.modal-overlay.show{
  opacity:1;
  visibility:visible;
}

.modal-content{
  background:rgba(10,12,20,0.95);
  border:2px solid #00ccff;
  border-radius:24px;
  padding:30px 40px;
  max-width:450px;
  width:90%;
  box-shadow:0 0 50px #00ccff;
  text-align:center;
  position:relative;

  transform:translateY(40px) scale(.9);
  opacity:0;
  transition:all .4s cubic-bezier(.2,.8,.2,1);
}

.modal-overlay.show .modal-content{
  transform:translateY(0) scale(1);
  opacity:1;
}

.modal-content h2{
  font-family:Orbitron;
  font-size:26px;
  margin-bottom:20px;
  background:linear-gradient(45deg,#00ccff,#4fd1ff,#00eaff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.modal-content p{font-size:18px;margin-bottom:25px;color:#ddd;}

.modal-button{
  background:#00ccff;
  border:none;
  border-radius:40px;
  padding:10px 25px;
  font-size:15px;
  font-weight:600;
  color:#000;
  cursor:pointer;
  transition:.3s;
}
.modal-button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ccff;
}

.modal-close{
  position:absolute;
  top:15px;
  right:20px;
  font-size:26px;
  cursor:pointer;
  color:#aaa;
  transition:.3s;
}
.modal-close:hover{color:#00ccff;}
</style>
</head>
<body>

<div class="background"></div>
<div class="grid"></div>

<div class="nav">
<a href="https://donatex.gg/donate/kapitanych" target="_blank">Donatex</a>
<a href="https://new.donatepay.ru/@Kapitan" target="_blank">DonatPay</a>
<a href="https://t.me/KapitanGG" target="_blank">Telegram</a>
<a href="https://discord.com/" target="_blank">Discord</a>
<a href="https://www.youtube.com/@Капитаныч" target="_blank">YouTube</a>
<a href="https://www.tiktok.com/@tt_kapitanych" target="_blank">TikTok</a>
</div>

<section class="hero">
<img src="https://raw.githubusercontent.com/multivarka01/kapitanych/main/avatar.jpg"
class="avatar-img"
onclick="window.open('https://twitch.tv/kapitanych_','_blank')">

<h1>KAPITANYCH</h1>

<div class="modules">
<div class="row">
<div class="module left-start" id="donatex" onclick="window.open('https://donatex.gg/donate/kapitanych','_blank')"><h3>DONATEX</h3></div>
<div class="module bottom-start" id="telegram" onclick="window.open('https://t.me/KapitanGG','_blank')"><h3>TELEGRAM</h3></div>
<div class="module right-start" id="youtube" onclick="window.open('https://www.youtube.com/@Капитаныч','_blank')"><h3>YOUTUBE</h3></div>
</div>
<div class="row">
<div class="module left-start" id="discord" onclick="window.open('https://discord.com/','_blank')"><h3>DISCORD</h3></div>
<div class="module right-start" id="tiktok" onclick="window.open('https://www.tiktok.com/@tt_kapitanych','_blank')"><h3>TIKTOK</h3></div>
</div>
</div>
</section>

<div class="glass-bar">
<button class="bar-button" onclick="showTwitchModal()">Twitch Sub</button>
<div class="vertical-block">
<span class="kapitanych-text">© 2026 Kapitanych</span>
<a href="https://t.me/multicooker01" target="_blank" class="multivarka-link">MULTIVARKA</a>
</div>
</div>

<div class="modal-overlay" id="twitchModalOverlay">
<div class="modal-content">
<span class="modal-close" onclick="closeTwitchModal()">&times;</span>
<h2>Подписка на Twitch</h2>
<p>
<a href="https://www.twitch.tv/products/kapitanych_" target="_blank" style="color:#00ccff;text-decoration:none;">
Поддержи Twitch своей платной подпиской!
</a>
</p>
<button class="modal-button" onclick="closeTwitchModal()">Закрыть</button>
</div>
</div>

<script>
window.addEventListener("load",()=>{
setTimeout(()=>donatex.classList.add("show"),200);
setTimeout(()=>youtube.classList.add("show"),350);
setTimeout(()=>telegram.classList.add("show"),500);
setTimeout(()=>discord.classList.add("show"),650);
setTimeout(()=>tiktok.classList.add("show"),800);
});

function showTwitchModal(){
document.getElementById("twitchModalOverlay").classList.add("show");
}
function closeTwitchModal(){
document.getElementById("twitchModalOverlay").classList.remove("show");
}
document.addEventListener("keydown",e=>{
if(e.key==="Escape") closeTwitchModal();
});
</script>

</body>
</html>
