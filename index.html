<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kapitanych · Multivarka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',system-ui;
background:#06080f;
color:white;
overflow:hidden;
display:flex;
flex-direction:column;
min-height:100vh;
}

/* BACKGROUND */

.background{
position:fixed;
inset:0;
z-index:-2;

background:
radial-gradient(circle at 30% 30%,rgba(0,204,255,0.12),transparent 60%),
radial-gradient(circle at 70% 70%,rgba(0,150,255,0.1),transparent 60%),
#06080f;
}

.grid{
position:fixed;
inset:0;
z-index:-1;

background-image:
linear-gradient(rgba(0,204,255,0.12) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,204,255,0.12) 1px,transparent 1px);

background-size:50px 50px;

animation:moveGrid 18s linear infinite;

box-shadow:
inset 0 0 80px rgba(0,204,255,0.15),
0 0 120px rgba(0,204,255,0.1);
}

@keyframes moveGrid{

0%{transform:translateY(0);}
100%{transform:translateY(50px);}

}

/* NAVBAR */

.nav{

position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);

width:90%;
height:65px;

display:flex;
align-items:center;
gap:18px;

background:rgba(30,35,55,0.65);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

border-radius:20px;

border:1px solid rgba(0,204,255,0.25);

box-shadow:
0 0 30px rgba(0,204,255,0.15),
inset 0 0 35px rgba(255,255,255,0.05);

padding:0 20px;

z-index:10;
}

.nav a{

display:inline-block;
padding:8px 14px;

color:#aaa;
text-decoration:none;

font-weight:600;

border-radius:30px;

transition:0.2s;

}

.nav a:hover{

color:#00ccff;
text-shadow:0 0 12px #00ccff;

}

/* LOGO */

.logo-text{

font-family:'Orbitron';
font-weight:700;
font-size:20px;

letter-spacing:2px;

background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:0 0 20px rgba(0,204,255,0.6);

margin-right:20px;

}

/* TWITCH BUTTON */

.twitch-btn{

margin-left:auto;

background:linear-gradient(90deg,#6a7cff,#8ea2ff);

padding:8px 18px;

border-radius:30px;

color:white;
font-weight:600;

text-decoration:none;

box-shadow:0 0 15px rgba(120,140,255,0.6);

transition:0.25s;

}

.twitch-btn:hover{

transform:scale(1.05);
box-shadow:0 0 25px rgba(120,140,255,0.9);

}

/* HERO */

.hero{

flex:1;

padding-top:150px;
padding-bottom:90px;

display:flex;
flex-direction:column;
align-items:center;

text-align:center;

}

.avatar-img{

width:120px;
height:120px;

border-radius:50%;

border:3px solid #00ccff;

box-shadow:0 0 30px #00ccff;

margin-bottom:20px;

object-fit:cover;

transition:0.4s;

cursor:pointer;

}

.avatar-img:hover{

transform:scale(1.08);
box-shadow:0 0 60px #00ccff;

}

h1{

font-family:'Orbitron';

font-size:52px;

letter-spacing:4px;

background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:0 0 25px rgba(0,204,255,0.6);

}

/* MODULES */

.modules{

margin-top:60px;

display:flex;
flex-direction:column;

gap:30px;

}

.row{

display:flex;
gap:25px;

justify-content:center;
flex-wrap:wrap;

}

.module{

position:relative;

padding:35px 45px;

min-width:260px;

border-radius:16px;

backdrop-filter:blur(10px);

transition:transform 0.6s ease,background 0.3s;

cursor:pointer;

overflow:hidden;

opacity:0;

background:rgba(255,255,255,0.03);

border:1px solid rgba(0,204,255,0.6);

}

.module:hover{

transform:translateY(-6px) scale(1.03);

background:

radial-gradient(circle at var(--mouse-x,50%) var(--mouse-y,50%),rgba(0,204,255,0.2) 0%,transparent 60%),
rgba(255,255,255,0.03);

}

.module h3{

font-family:'Orbitron';

letter-spacing:3px;

font-size:18px;

}

/* ANIMATIONS */

.left-start{transform:translateX(-120px);}
.right-start{transform:translateX(120px);}
.bottom-start{transform:translateY(60px);}
.show{transform:translateX(0) translateY(0);opacity:1;}

/* FOOTER */

.glass-bar{

position:fixed;
bottom:0;

width:100%;

background:rgba(10,12,20,0.7);

backdrop-filter:blur(16px);

border-top:1px solid rgba(0,204,255,0.3);

padding:10px 15px;

display:flex;
flex-direction:column;

align-items:center;

gap:6px;

box-shadow:0 -8px 20px rgba(0,0,0,0.5);

}

.bar-button{

background:rgba(0,204,255,0.15);

border:1px solid rgba(0,204,255,0.6);

border-radius:30px;

padding:6px 18px;

color:white;

font-weight:600;

font-size:13px;

cursor:pointer;

transition:0.3s;

box-shadow:0 0 15px rgba(0,204,255,0.5);

}

.bar-button:hover{

box-shadow:0 0 25px #00ccff;
transform:scale(1.05);

}

.vertical-block{

display:flex;
flex-direction:column;

align-items:center;

font-size:13px;

}

.kapitanych-text{

font-weight:600;

background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:0 0 15px rgba(0,204,255,0.6);

}

.multivarka-link{

text-decoration:none;

font-weight:700;

background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:0 0 15px rgba(0,204,255,0.6);

}

</style>
</head>

<body>

<div class="background"></div>
<div class="grid"></div>

<nav class="navbar">
<div class="nav-left">
<img src="avatar.png" class="nav-avatar">
<div class="logo">Kapitanych</div>
</div>

<div class="nav-center">
<a href="#">Звонки</a>
<a href="#">Авторам</a>
<a href="#">FAQ</a>
<a href="#">Новости</a>
</div>

<div class="nav-right">
<a href="#" class="twitch-btn">Twitch</a>
</div>
</nav>

<style>
.navbar{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:90%;
height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-radius:18px;
background:rgba(40,40,45,0.85);
backdrop-filter:blur(12px);
box-shadow:0 0 20px rgba(0,0,0,0.25);
z-index:1000;
}

.nav-left{
display:flex;
align-items:center;
gap:12px;
}

.nav-avatar{
width:36px;
height:36px;
border-radius:50%;
object-fit:cover;
}

.logo{
color:white;
font-size:20px;
font-weight:600;
font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

.nav-center{
position:absolute;
left:50%;
transform:translateX(-50%);
display:flex;
gap:40px;
}

.nav-center a{
color:#d7d7d7;
text-decoration:none;
font-size:15px;
font-weight:500;
transition:0.2s;
}

.nav-center a:hover{
color:white;
}

.nav-right{
display:flex;
align-items:center;
}

.twitch-btn{
background:#5865F2;
color:white;
padding:10px 18px;
border-radius:12px;
text-decoration:none;
font-weight:600;
box-shadow:0 0 10px rgba(88,101,242,0.5);
transition:0.2s;
}

.twitch-btn:hover{
box-shadow:0 0 16px rgba(88,101,242,0.8);
transform:translateY(-1px);
}
</style>

<section class="hero">

<img
src="https://raw.githubusercontent.com/multivarka01/kapitanych/main/avatar.jpg"
class="avatar-img"
onclick="window.open('https://twitch.tv/kapitanych_','_blank')">

<h1>KAPITANYCH</h1>

<div class="modules">

<div class="row">

<div class="module left-start" id="donatex"
onclick="window.open('https://donatex.gg/donate/kapitanych','_blank')">
<h3>DONATEX</h3>
</div>

<div class="module bottom-start" id="telegram"
onclick="window.open('https://t.me/KapitanGG','_blank')">
<h3>TELEGRAM</h3>
</div>

<div class="module right-start" id="youtube"
onclick="window.open('https://www.youtube.com/@Капитаныч','_blank')">
<h3>YOUTUBE</h3>
</div>

</div>

<div class="row">

<div class="module left-start" id="discord"
onclick="window.open('https://discord.com/','_blank')">
<h3>DISCORD</h3>
</div>

<div class="module right-start" id="tiktok"
onclick="window.open('https://www.tiktok.com/@tt_kapitanych','_blank')">
<h3>TIKTOK</h3>
</div>

</div>

</div>

</section>

<div class="glass-bar">

<button class="bar-button"
onclick="window.open('https://www.twitch.tv/products/kapitanych_','_blank')">
Twitch Sub
</button>

<div class="vertical-block">

<span class="kapitanych-text">© 2026 Kapitanych</span>

<a href="https://t.me/multicooker01"
target="_blank"
class="multivarka-link">

MULTIVARKA

</a>

</div>

</div>

<script>

window.addEventListener("load",()=>{

setTimeout(()=>document.getElementById("donatex").classList.add("show"),200);
setTimeout(()=>document.getElementById("youtube").classList.add("show"),350);
setTimeout(()=>document.getElementById("telegram").classList.add("show"),500);
setTimeout(()=>document.getElementById("discord").classList.add("show"),650);
setTimeout(()=>document.getElementById("tiktok").classList.add("show"),800);

});

</script>

</body>
</html>
