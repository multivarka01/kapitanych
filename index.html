<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitanych</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,system-ui,Arial;
  background:#0b0f1a;
  color:white;
  overflow-x:hidden;
}

/* NAVBAR */

.nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  background:rgba(15,18,35,0.6);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  z-index:10;
}

.nav a{
  color:#aaa;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

.nav a:hover{
  color:#fff;
  text-shadow:0 0 12px #6cf;
}

.nav-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #6cf;
  box-shadow:0 0 15px #6cf;
  cursor:pointer;
  transition:.3s;
}

.nav-avatar:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px #6cf;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding-top:100px;
  text-align:center;
}

.hero h1{
  font-size:48px;
  margin-bottom:10px;
}

.subtitle{
  color:#888;
  letter-spacing:2px;
}

/* MODULES */

.modules{
  margin-top:60px;
  display:flex;
  flex-direction:column;
  gap:30px;
  align-items:center;
}

.row{
  display:flex;
  gap:25px;
  justify-content:center;
  flex-wrap:wrap;
}

.module{
  width:220px;
  height:120px;
  border:2px solid #6cf;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.4s;
  background:rgba(255,255,255,0.03);
}

.module h3{
  letter-spacing:2px;
}

.module:hover{
  background:#6cf;
  color:#0b0f1a;
  box-shadow:0 0 25px #6cf;
  transform:translateY(-6px);
}

/* FOOTER */

.footer{
  position:fixed;
  bottom:20px;
  left:20px;
  font-family:monospace;
  font-size:14px;
  opacity:.7;
}

.footer .brand{
  font-weight:700;
  color:white;
}

.dev{
  margin-top:4px;
  color:#888;
}

/* MOBILE */

@media (max-width:768px){
  .hero h1{font-size:32px;}
  .module{width:90%; max-width:300px;}
}
</style>
</head>
<body>

<!-- NAV -->
<div class="nav">
  <a href="https://www.donationalerts.com/r/bossgg" target="_blank">DonatAlerts</a>
  <a href="https://t.me/KapitanGG" target="_blank">Telegram</a>

  <!-- ЛОКАЛЬНЫЙ PNG -->
  <img src="assets/avatar.png" class="nav-avatar"
       onclick="window.open('https://twitch.tv/kapitanych_','_blank')">

  <a href="https://www.youtube.com/@Капитаныч" target="_blank">YouTube</a>
  <a href="https://www.tiktok.com/@tt_kapitanych" target="_blank">TikTok</a>
</div>

<!-- HERO -->
<section class="hero">

  <h1>Kapitanych</h1>
  <div class="subtitle">STANDOFF 2</div>

  <div class="modules">

    <div class="row">
      <div class="module" onclick="window.open('https://www.donationalerts.com/r/bossgg','_blank')">
        <h3>DONATALERTS</h3>
      </div>

      <div class="module" onclick="window.open('https://t.me/KapitanGG','_blank')">
        <h3>TELEGRAM</h3>
      </div>

      <div class="module" onclick="window.open('https://www.youtube.com/@Капитаныч','_blank')">
        <h3>YOUTUBE</h3>
      </div>
    </div>

    <div class="row">
      <div class="module" onclick="window.open('https://discord.com/','_blank')">
        <h3>DISCORD</h3>
      </div>

      <div class="module" onclick="window.open('https://www.tiktok.com/@tt_kapitanych','_blank')">
        <h3>TIKTOK</h3>
      </div>
    </div>

  </div>
</section>

<!-- FOOTER -->
<div class="footer">
  <div class="brand">Kapitanych</div>
  <div>© 2026 KAPITANYCH. ALL RIGHTS RESERVED</div>
  <div class="dev">Разработка — Multivarka</div>
</div>

</body>
</html>
