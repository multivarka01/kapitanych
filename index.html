<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitanych</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,system-ui,Arial;
  background:#0b0f1a;
  color:white;
  overflow-x:hidden;
}

/* LOADER */

.loader{
  position:fixed;
  inset:0;
  background:#0b0f1a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  transition:opacity .6s ease;
}

.loader span{
  width:60px;
  height:60px;
  border:4px solid #6cf;
  border-top:4px solid transparent;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* NAV */

.nav{
  position:fixed;
  top:0;
  width:100%;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
  background:rgba(15,18,35,0.6);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  z-index:10;
}

.nav a{
  color:#aaa;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

.nav a:hover{
  color:#fff;
  text-shadow:0 0 12px #6cf;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding-top:90px;
}

.avatar{
  width:140px;
  height:140px;
  border-radius:50%;
  border:3px solid #6cf;
  box-shadow:0 0 25px #6cf;
  margin-bottom:20px;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

.hero h1{
  font-size:48px;
  margin-bottom:8px;
}

.subtitle{
  color:#888;
  letter-spacing:2px;
  margin-bottom:40px;
}

/* MODULES */

.modules{
  display:flex;
  flex-direction:column;
  gap:30px;
  align-items:center;
}

.row{
  display:flex;
  gap:25px;
  justify-content:center;
  flex-wrap:wrap;
}

.module{
  width:220px;
  height:120px;
  border:2px solid #6cf;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.4s;
  background:rgba(255,255,255,0.03);
}

.module h3{letter-spacing:2px;}

.module:hover{
  background:#6cf;
  color:#0b0f1a;
  box-shadow:0 0 25px #6cf;
  transform:translateY(-6px);
}

/* BACKGROUND GLOW */

.bg{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(circle at 20% 30%, rgba(108,200,255,0.2), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(170,120,255,0.2), transparent 40%);
}

/* FOOTER */

.footer{
  position:fixed;
  bottom:20px;
  left:20px;
  font-family:monospace;
  font-size:14px;
  opacity:.7;
}

.footer .brand{font-weight:700;}
.dev{color:#888;margin-top:4px;}

@media(max-width:768px){
  .hero h1{font-size:32px;}
  .module{width:90%;max-width:300px;}
}
</style>
</head>
<body>

<div class="loader"><span></span></div>
<div class="bg"></div>

<!-- NAVBAR -->
<div class="nav">
  <a href="https://www.donationalerts.com/r/bossgg" target="_blank">DonatAlerts</a>
  <a href="https://t.me/KapitanGG" target="_blank">Telegram</a>
  <a href="https://discord.com/" target="_blank">Discord</a>
  <a href="https://www.youtube.com/@Капитаныч" target="_blank">YouTube</a>
  <a href="https://www.tiktok.com/@tt_kapitanych" target="_blank">TikTok</a>
</div>

<!-- HERO -->
<section class="hero">

  <!-- ЛОКАЛЬНЫЙ PNG -->
  <img src="assets/avatar.png" class="avatar">

  <h1>Kapitanych</h1>
  <div class="subtitle">Multivarka</div>

  <div class="modules">

    <div class="row">
      <div class="module" onclick="window.open('https://www.donationalerts.com/r/bossgg','_blank')">
        <h3>DONATALERTS</h3>
      </div>

      <div class="module" onclick="window.open('https://t.me/KapitanGG','_blank')">
        <h3>TELEGRAM</h3>
      </div>

      <div class="module" onclick="window.open('https://www.youtube.com/@Капитаныч','_blank')">
        <h3>YOUTUBE</h3>
      </div>
    </div>

    <div class="row">
      <div class="module" onclick="window.open('https://discord.com/','_blank')">
        <h3>DISCORD</h3>
      </div>

      <div class="module" onclick="window.open('https://www.tiktok.com/@tt_kapitanych','_blank')">
        <h3>TIKTOK</h3>
      </div>
    </div>

  </div>
</section>

<!-- FOOTER -->
<div class="footer">
  <div class="brand">Kapitanych</div>
  <div>© 2026 KAPITANYCH. ALL RIGHTS RESERVED</div>
  <div class="dev">Разработка — Multivarka</div>
</div>

<script>
window.addEventListener("load",()=>{
  document.querySelector(".loader").style.opacity="0";
  setTimeout(()=>document.querySelector(".loader").remove(),600);
});
</script>

</body>
</html>
