<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitanych</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Inter,system-ui;
  background:#06080f;
  color:white;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* ===== BACKGROUND ===== */
.background{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 30% 30%, rgba(168,85,247,0.15), transparent 60%),
    radial-gradient(circle at 70% 70%, rgba(255,0,255,0.1), transparent 60%),
    #06080f;
}
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(168,85,247,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168,85,247,0.07) 1px, transparent 1px);
  background-size:60px 60px;
  animation:moveGrid 20s linear infinite;
  z-index:-1;
}
@keyframes moveGrid{
  0%{transform:translateY(0);}
  100%{transform:translateY(60px);}
}

/* ===== NAV ===== */
.nav{
  position:fixed;
  top:0;
  width:100%;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:35px;
  background:rgba(10,12,20,0.6);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.05);
  z-index:10;
}
.nav a{
  color:#aaa;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}
.nav a:hover{
  color:#a855f7;
  text-shadow:0 0 12px #a855f7;
}

/* ===== HERO ===== */
.hero{
  flex:1;
  padding-top:130px;
  padding-bottom:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.avatar-img{
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid #a855f7;
  box-shadow:0 0 30px #a855f7;
  margin-bottom:20px;
  object-fit:cover;
  transition:.4s;
  cursor:pointer;
}
.avatar-img:hover{
  transform:scale(1.08);
  box-shadow:0 0 60px #a855f7;
}

h1{
  font-family:Orbitron;
  font-size:52px;
  letter-spacing:4px;
}

/* ===== MODULES ===== */
.modules{margin-top:60px;display:flex;flex-direction:column;gap:30px;}
.row{display:flex;gap:25px;justify-content:center;flex-wrap:wrap;}
.module{
  position:relative;
  padding:35px 45px;
  min-width:260px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(168,85,247,0.4);
  border-radius:16px;
  backdrop-filter:blur(10px);
  transition:.6s ease;
  cursor:pointer;
  overflow:hidden;
  opacity:0;
}
.module::before,.module::after{
  content:"";
  position:absolute;
  width:25px;
  height:25px;
  border:2px solid #a855f7;
}
.module::before{top:0;left:0;border-right:none;border-bottom:none;}
.module::after{bottom:0;right:0;border-left:none;border-top:none;}
.module h3{
  font-family:Orbitron;
  letter-spacing:3px;
  font-size:18px;
}
.module:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 0 40px rgba(168,85,247,.7);
}

.left-start{transform:translateX(-120px);}
.right-start{transform:translateX(120px);}
.bottom-start{transform:translateY(60px);}
.show{transform:translateX(0) translateY(0);opacity:1;}

/* ===== GLASS BAR ===== */
.glass-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(10,12,20,0.7);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(168,85,247,0.3);
  padding:10px 15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  box-shadow:0 -8px 20px rgba(0,0,0,0.5);
  z-index:20;
}

.bar-button{
  background:rgba(168,85,247,0.15);
  border:1px solid rgba(168,85,247,0.5);
  border-radius:30px;
  padding:6px 18px;
  color:white;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  transition:.3s;
  backdrop-filter:blur(5px);
  box-shadow:0 0 10px rgba(168,85,247,0.2);
}
.bar-button:hover{
  background:rgba(168,85,247,0.3);
  border-color:#a855f7;
  box-shadow:0 0 20px #a855f7;
  transform:scale(1.05);
}

.vertical-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:.4;
  font-size:13px;
}

/* ===== MODALS ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10000;
  opacity:0;
  visibility:hidden;
  transition:.3s;
}
.modal-overlay.show{opacity:1;visibility:visible;}
.modal-content{
  position:relative;
  background:rgba(10,12,20,0.95);
  border:2px solid #a855f7;
  border-radius:24px;
  padding:35px 40px;
  max-width:450px;
  width:90%;
  box-shadow:0 0 60px #a855f7;
  text-align:center;
}
.modal-content h2{
  font-family:Orbitron;
  font-size:26px;
  margin-bottom:20px;
  background:linear-gradient(45deg,#a855f7,#ff00ff,#00ccff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.modal-content p{font-size:18px;margin-bottom:20px;color:#ddd;}

#adminToggle{
  position:fixed;
  top:15px;
  right:15px;
  z-index:9999;
  padding:8px 18px;
  border-radius:30px;
  background:#a855f7;
  border:none;
  color:black;
  font-weight:600;
  cursor:pointer;
  display:none;
}
</style>
</head>
<body>

<div class="background"></div>
<div class="grid"></div>

<div class="nav">
<a href="https://donatex.gg/donate/kapitanych" target="_blank">Donatex</a>
<a href="https://new.donatepay.ru/@Kapitan" target="_blank">DonatPay</a>
<a href="https://t.me/KapitanGG" target="_blank">Telegram</a>
<a href="https://discord.com/" target="_blank">Discord</a>
<a href="https://www.youtube.com/@Капитаныч" target="_blank">YouTube</a>
<a href="https://www.tiktok.com/@tt_kapitanych" target="_blank">TikTok</a>
</div>

<section class="hero">
<img src="https://raw.githubusercontent.com/multivarka01/kapitanych/main/avatar.jpg"
class="avatar-img"
onclick="window.open('https://twitch.tv/kapitanych_','_blank')">

<h1>KAPITANYCH</h1>

<div class="modules">
<div class="row">
<div class="module left-start" id="donatex" onclick="window.open('https://donatex.gg/donate/kapitanych','_blank')"><h3>DONATEX</h3></div>
<div class="module bottom-start" id="telegram" onclick="window.open('https://t.me/KapitanGG','_blank')"><h3>TELEGRAM</h3></div>
<div class="module right-start" id="youtube" onclick="window.open('https://www.youtube.com/@Капитаныч','_blank')"><h3>YOUTUBE</h3></div>
</div>
<div class="row">
<div class="module left-start" id="discord" onclick="window.open('https://discord.com/','_blank')"><h3>DISCORD</h3></div>
<div class="module right-start" id="tiktok" onclick="window.open('https://www.tiktok.com/@tt_kapitanych','_blank')"><h3>TIKTOK</h3></div>
</div>
</div>
</section>

<div class="glass-bar">
<button class="bar-button" onclick="showTwitchModal()">Twitch Sub</button>
<div class="vertical-block">
<span>© 2026 Kapitanych</span>
<span>MULTIVARKA</span>
</div>
</div>

<button id="adminToggle">🔒 Закрыть сайт</button>

<div class="modal-overlay" id="siteClosedOverlay">
<div class="modal-content">
<h2>Сайт временно недоступен</h2>
<p>⚠ Администратор временно закрыл сайт.<br>Попробуйте позже.</p>
</div>
</div>

<script>
const ADMIN_PASSWORD = "kapitanych_admin";

window.addEventListener("load",()=>{
setTimeout(()=>donatex.classList.add("show"),200);
setTimeout(()=>youtube.classList.add("show"),350);
setTimeout(()=>telegram.classList.add("show"),500);
setTimeout(()=>discord.classList.add("show"),650);
setTimeout(()=>tiktok.classList.add("show"),800);

if(localStorage.getItem("siteClosed")==="true"){
document.getElementById("siteClosedOverlay").classList.add("show");
}

if(localStorage.getItem("isAdmin")==="true"){
document.getElementById("adminToggle").style.display="block";
}
});

function adminLogin(){
const pass=prompt("Введите пароль администратора:");
if(pass===ADMIN_PASSWORD){
localStorage.setItem("isAdmin","true");
document.getElementById("adminToggle").style.display="block";
alert("Админ доступ получен");
}else{
alert("Неверный пароль");
}
}

function toggleSite(){
const closed=localStorage.getItem("siteClosed");
if(closed==="true"){
localStorage.setItem("siteClosed","false");
document.getElementById("siteClosedOverlay").classList.remove("show");
document.getElementById("adminToggle").innerText="🔒 Закрыть сайт";
}else{
localStorage.setItem("siteClosed","true");
document.getElementById("siteClosedOverlay").classList.add("show");
document.getElementById("adminToggle").innerText="🔓 Открыть сайт";
}
}

document.addEventListener("keydown",e=>{
if(e.ctrlKey && (e.key==="q" || e.key==="й")){
e.preventDefault();
adminLogin();
}
});

document.getElementById("adminToggle").addEventListener("click",toggleSite);
</script>

</body>
</html>
