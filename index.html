<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitanych · Multivarka</title>

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* ----- base reset ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui;
            background: #06080f;
            color: white;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ----- background effects ----- */
        .background {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 30% 30%, rgba(0,204,255,0.12), transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(0,150,255,0.1), transparent 60%),
                #06080f;
        }

        .grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(0,204,255,0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,204,255,0.12) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 18s linear infinite;
            box-shadow:
                inset 0 0 80px rgba(0,204,255,0.15),
                0 0 120px rgba(0,204,255,0.1);
        }

        @keyframes moveGrid {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* ----- navigation bar (fixed) ----- */
        .nav {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            min-height: 65px;
            display: flex;
            align-items: center;
            gap: 10px;                      /* уменьшенный gap */
            background: rgba(30,35,55,0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 20px;
            border: 1px solid rgba(0,204,255,0.25);
            box-shadow: 0 0 30px rgba(0,204,255,0.15), inset 0 0 35px rgba(255,255,255,0.05);
            padding: 0 15px;
            z-index: 10;
            flex-wrap: wrap;                 /* перенос на мобильных */
        }

        /* левый блок с аватаркой и логотипом */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .nav-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ccff;
            box-shadow: 0 0 10px #00ccff;
        }

        .logo-text {
            font-family: 'Orbitron';
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 2px;
            color: white;                    /* белый текст */
            text-shadow: 0 0 20px rgba(0,204,255,0.6);
            white-space: nowrap;
        }

        /* центральные ссылки (соцсети) */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;                        /* маленький gap */
            flex-wrap: wrap;
            flex: 1 1 auto;
            justify-content: center;
        }

        .nav-links a {
            color: white;                     /* белый текст */
            font-size: 14px;                  /* уменьшенный размер */
            font-weight: 600;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 30px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: #00ccff;
            text-shadow: 0 0 12px #00ccff;
        }

        /* правая часть — кнопка Twitch */
        .nav-right {
            flex-shrink: 0;
            margin-left: auto;
        }

        .twitch-btn {
            background: linear-gradient(90deg, #6a7cff, #8ea2ff);
            padding: 6px 16px;                /* чуть меньше */
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(120,140,255,0.6);
            transition: 0.25s;
            display: inline-block;
            white-space: nowrap;
        }

        .twitch-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(120,140,255,0.9);
        }

        /* ----- hero section ----- */
        .hero {
            flex: 1;
            padding-top: 130px;               /* меньше отступ, чтобы навигация не перекрывала */
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00ccff;
            box-shadow: 0 0 30px #00ccff;
            margin-bottom: 20px;
            object-fit: cover;
            transition: 0.4s;
            cursor: pointer;
        }

        .avatar-img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 60px #00ccff;
        }

        h1 {
            font-family: 'Orbitron';
            font-size: 52px;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #00ccff, #4fd1ff, #00eaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0,204,255,0.6);
        }

        /* ----- modules (плитки) ----- */
        .modules {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .row {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .module {
            position: relative;
            padding: 35px 45px;
            min-width: 260px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            transition: transform 0.6s ease, background 0.3s;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(0,204,255,0.6);
        }

        .module:hover {
            transform: translateY(-6px) scale(1.03);
            background:
                radial-gradient(circle at var(--mouse-x,50%) var(--mouse-y,50%), rgba(0,204,255,0.2) 0%, transparent 60%),
                rgba(255,255,255,0.03);
        }

        .module h3 {
            font-family: 'Orbitron';
            letter-spacing: 3px;
            font-size: 18px;
            color: white;
        }

        /* анимации появления */
        .left-start { transform: translateX(-120px); }
        .right-start { transform: translateX(120px); }
        .bottom-start { transform: translateY(60px); }
        .show { transform: translateX(0) translateY(0); opacity: 1; }

        /* ----- glass footer ----- */
        .glass-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(10,12,20,0.7);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(0,204,255,0.3);
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-shadow: 0 -8px 20px rgba(0,0,0,0.5);
            z-index: 5;
        }

        .bar-button {
            background: rgba(0,204,255,0.15);
            border: 1px solid rgba(0,204,255,0.6);
            border-radius: 30px;
            padding: 6px 18px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0,204,255,0.5);
        }

        .bar-button:hover {
            box-shadow: 0 0 25px #00ccff;
            transform: scale(1.05);
        }

        .vertical-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 13px;
        }

        .kapitanych-text {
            font-weight: 600;
            background: linear-gradient(90deg, #00ccff, #4fd1ff, #00eaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0,204,255,0.6);
        }

        .multivarka-link {
            text-decoration: none;
            font-weight: 700;
            background: linear-gradient(90deg, #00ccff, #4fd1ff, #00eaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0,204,255,0.6);
        }

        /* адаптация для маленьких экранов */
        @media (max-width: 1000px) {
            .nav {
                gap: 8px;
            }
            .nav-links a {
                font-size: 13px;
                padding: 5px 8px;
            }
            .logo-text {
                font-size: 18px;
            }
        }
        @media (max-width: 750px) {
            .nav {
                flex-direction: column;
                align-items: stretch;
                height: auto;
                padding: 10px;
            }
            .nav-left {
                justify-content: center;
            }
            .nav-links {
                justify-content: center;
            }
            .nav-right {
                margin-left: 0;
                text-align: center;
            }
            .hero {
                padding-top: 200px;  /* больше отступа из-за высокой навигации */
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="grid"></div>

    <!-- НАВИГАЦИЯ с аватаркой, белыми ссылками и новыми кнопками -->
    <nav class="nav">
        <div class="nav-left">
            <img src="https://raw.githubusercontent.com/multivarka01/kapitanych/main/avatar.jpg"
                 class="nav-avatar"
                 alt="Kapitanych">
            <span class="logo-text">KAPITANYCH</span>
        </div>

        <div class="nav-links">
            <a href="https://donatex.gg/donate/kapitanych" target="_blank">Donatex</a>
            <a href="https://new.donatepay.ru/@Kapitan" target="_blank">DonatPay</a>
            <a href="https://t.me/KapitanGG" target="_blank">Telegram</a>
            <a href="https://discord.com/" target="_blank">Discord</a>
            <a href="https://www.youtube.com/@Капитаныч" target="_blank">YouTube</a>
            <a href="https://www.tiktok.com/@tt_kapitanych" target="_blank">TikTok</a>
        </div>

        <div class="nav-right">
            <a href="#" class="twitch-btn">Twitch</a>
        </div>
    </nav>

    <!-- HERO секция -->
    <section class="hero">
        <img src="https://raw.githubusercontent.com/multivarka01/kapitanych/main/avatar.jpg"
             class="avatar-img"
             onclick="window.open('https://twitch.tv/kapitanych_','_blank')"
             alt="Kapitanych avatar">
        <h1>KAPITANYCH</h1>

        <div class="modules">
            <div class="row">
                <div class="module left-start" id="donatex"
                     onclick="window.open('https://donatex.gg/donate/kapitanych','_blank')">
                    <h3>DONATEX</h3>
                </div>
                <div class="module bottom-start" id="telegram"
                     onclick="window.open('https://t.me/KapitanGG','_blank')">
                    <h3>TELEGRAM</h3>
                </div>
                <div class="module right-start" id="youtube"
                     onclick="window.open('https://www.youtube.com/@Капитаныч','_blank')">
                    <h3>YOUTUBE</h3>
                </div>
            </div>
            <div class="row">
                <div class="module left-start" id="discord"
                     onclick="window.open('https://discord.com/','_blank')">
                    <h3>DISCORD</h3>
                </div>
                <div class="module right-start" id="tiktok"
                     onclick="window.open('https://www.tiktok.com/@tt_kapitanych','_blank')">
                    <h3>TIKTOK</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- ФУТЕР -->
    <div class="glass-bar">
        <button class="bar-button"
                onclick="window.open('https://www.twitch.tv/products/kapitanych_','_blank')">
            Twitch Sub
        </button>
        <div class="vertical-block">
            <span class="kapitanych-text">© 2026 Kapitanych</span>
            <a href="https://t.me/multicooker01" target="_blank" class="multivarka-link">MULTIVARKA</a>
        </div>
    </div>

    <!-- СКРИПТ ДЛЯ АНИМАЦИЙ -->
    <script>
        window.addEventListener("load", () => {
            setTimeout(() => document.getElementById("donatex").classList.add("show"), 200);
            setTimeout(() => document.getElementById("youtube").classList.add("show"), 350);
            setTimeout(() => document.getElementById("telegram").classList.add("show"), 500);
            setTimeout(() => document.getElementById("discord").classList.add("show"), 650);
            setTimeout(() => document.getElementById("tiktok").classList.add("show"), 800);
        });

        // эффект свечения от мыши на модулях
        document.querySelectorAll('.module').forEach(module => {
            module.addEventListener('mousemove', (e) => {
                const rect = module.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                module.style.setProperty('--mouse-x', x + '%');
                module.style.setProperty('--mouse-y', y + '%');
            });
        });
    </script>
</body>
</html>
