<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header Example</title>
<style>
  :root {
    --bg: #1f1f1f;
    --accent: #9146FF;
    --card-bg: #262626;
    --muted: #8f8f8f;
  }
  body {
    margin: 0;
    font-family: sans-serif;
    background: #121212;
    color: #fff;
  }

  /* Header */
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1rem;
    height: 60px;
    background: var(--bg);
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
  }

  .logo {
    height: 40px;
  }

  .nav-section {
    display: flex;
    gap: 1rem;
  }

  .nav-btn {
    color: var(--muted);
    text-decoration: none;
    font-weight: 600;
    padding: 0.25rem 0.5rem;
    transition: color 0.2s;
  }

  .nav-btn:hover, .nav-btn.active {
    color: var(--accent);
    text-decoration: underline;
  }

  /* Search */
  .search-section {
    flex: 1;
    max-width: 300px;
    margin: 0 1rem;
  }

  .search-input {
    width: 100%;
    padding: 0.5rem 0.75rem;
    padding-left: 2rem;
    border-radius: 6px;
    border: 1px solid #404040;
    background: #444 url('https://cdn-icons-png.flaticon.com/512/622/622669.png') no-repeat 0.5rem center / 16px 16px;
    color: #fff;
    outline: none;
  }

  .search-input::placeholder {
    color: #8f8f8f;
  }

  .search-input:focus {
    border-color: var(--accent);
  }

  /* Auth & Avatar */
  .auth-section {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .auth-btn {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .auth-btn:hover {
    background: #7d3ad6;
  }

  .avatar-wrap {
    position: relative;
  }

  .avatar-btn {
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
  }

  .avatar-img {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
  }

  /* Dropdown */
  .dropdown-menu {
    display: none;
    position: absolute;
    top: 50px;
    right: 0;
    background: var(--card-bg);
    border-radius: 8px;
    border: 1px solid #333;
    min-width: 150px;
    z-index: 1000;
  }

  .dropdown-menu a {
    display: block;
    padding: 0.5rem 1rem;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }

  .dropdown-menu a:hover {
    background: #343434;
  }

  /* Notifications */
  .notif-wrap {
    position: relative;
  }

  .notif-btn {
    width: 40px;
    height: 40px;
    background: #2a2a2a;
    border: 1px solid #404040;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
  }

  .notif-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 0.7rem;
    font-weight: bold;
  }

  .notif-menu {
    display: none;
    position: absolute;
    top: 50px;
    right: 0;
    background: var(--card-bg);
    border-radius: 8px;
    border: 1px solid #333;
    min-width: 200px;
    z-index: 1000;
  }

  .notif-item {
    padding: 0.5rem 1rem;
    border-bottom: 1px solid #333;
    font-size: 0.9rem;
  }

  .notif-item:last-child {
    border-bottom: none;
  }

  .notif-item:hover {
    background: #303030;
  }

  /* Scroll to top */
  .scroll-top-btn {
    position: fixed;
    bottom: 1rem;
    left: 1rem;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #404040;
    background: var(--card-bg);
    color: #fff;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1300;
  }

  .scroll-top-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
</style>
</head>
<body>

<header class="main-header">
  <img src="https://via.placeholder.com/120x40?text=LOGO" alt="Logo" class="logo">

  <nav class="nav-section">
    <a href="#" class="nav-btn active">Home</a>
    <a href="#" class="nav-btn">Feed</a>
    <a href="#" class="nav-btn">Explore</a>
  </nav>

  <div class="search-section">
    <input type="text" class="search-input" placeholder="Search...">
  </div>

  <div class="auth-section">
    <button class="auth-btn">Sign In</button>

    <div class="notif-wrap">
      <button class="notif-btn" id="notifBtn"></button>
      <span class="notif-badge" id="notifBadge">3</span>
      <div class="notif-menu" id="notifMenu">
        <div class="notif-item">New follower</div>
        <div class="notif-item">New comment</div>
        <div class="notif-item">Donation received</div>
      </div>
    </div>

    <div class="avatar-wrap">
      <button class="avatar-btn" id="avatarBtn">
        <img src="https://via.placeholder.com/40" alt="Avatar" class="avatar-img">
      </button>
      <div class="dropdown-menu" id="dropdownMenu">
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
      </div>
    </div>
  </div>
</header>

<button class="scroll-top-btn" id="scrollTopBtn">
  <svg viewBox="0 0 20 20"><path d="M10 5l-5 5h10l-5-5z"/></svg>
</button>

<script>
  // Avatar dropdown
  const avatarBtn = document.getElementById('avatarBtn');
  const dropdownMenu = document.getElementById('dropdownMenu');
  avatarBtn.addEventListener('click', () => {
    dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
  });

  // Notifications dropdown
  const notifBtn = document.getElementById('notifBtn');
  const notifMenu = document.getElementById('notifMenu');
  notifBtn.addEventListener('click', () => {
    notifMenu.style.display = notifMenu.style.display === 'block' ? 'none' : 'block';
  });

  // Scroll to top
  const scrollTopBtn = document.getElementById('scrollTopBtn');
  window.addEventListener('scroll', () => {
    scrollTopBtn.style.display = window.scrollY > 200 ? 'flex' : 'none';
  });
  scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({top: 0, behavior: 'smooth'});
  });

  // Close dropdowns if click outside
  window.addEventListener('click', e => {
    if (!avatarBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
      dropdownMenu.style.display = 'none';
    }
    if (!notifBtn.contains(e.target) && !notifMenu.contains(e.target)) {
      notifMenu.style.display = 'none';
    }
  });
</script>

</body>
</html>
