<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapitanych · Multivarka</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui;
      background: #06080f;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== ФОН И СЕТКА ===== */
    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(circle at 30% 30%, rgba(0,204,255,0.12), transparent 60%),
                  radial-gradient(circle at 70% 70%, rgba(0,150,255,0.1), transparent 60%),
                  #06080f;
    }

    .grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: linear-gradient(rgba(0,204,255,0.12) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,204,255,0.12) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: moveGrid 18s linear infinite;
      box-shadow: inset 0 0 80px rgba(0,204,255,0.15), 0 0 120px rgba(0,204,255,0.1);
    }
    @keyframes moveGrid {
      0% { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }

    /* ===== НАВИГАЦИЯ (только подсветка текста) ===== */
    .nav {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(15,18,30,0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 20px;
      border: 1px solid rgba(0,204,255,0.25);
      box-shadow: 0 0 30px rgba(0,204,255,0.15), inset 0 0 25px rgba(255,255,255,0.03);
      z-index: 10;
    }

    .nav a {
      display: inline-block;
      padding: 8px 14px;
      color: #aaa;
      text-decoration: none;
      font-weight: 600;
      border-radius: 30px;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .nav a:hover {
      color: #00ccff;
      text-shadow: 0 0 12px #00ccff;
    }

    /* ===== HERO ===== */
    .hero {
      flex: 1;
      padding-top: 150px;
      padding-bottom: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #00ccff;
      box-shadow: 0 0 30px #00ccff;
      margin-bottom: 20px;
      object-fit: cover;
      transition: 0.4s;
      cursor: pointer;
    }

    .avatar-img:hover {
      transform: scale(1.08);
      box-shadow: 0 0 60px #00ccff;
    }

    h1 {
      font-family: 'Orbitron';
      font-size: 52px;
      letter-spacing: 4px;
      background: linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0,204,255,0.6);
    }

    /* ===== МОДУЛИ (поднятие + следящее свечение, БЕЗ внешней тени) ===== */
    .modules {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .row {
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .module {
      position: relative;
      padding: 35px 45px;
      min-width: 260px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      transition: transform 0.6s ease, background 0.3s, color 0.3s, text-shadow 0.3s; /* убрал box-shadow из transition */
      cursor: pointer;
      overflow: hidden;
      opacity: 0;

      /* базовый фон + подготовка для градиента */
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(0,204,255,0.6);
      background-repeat: no-repeat;
    }

    .module:hover {
      transform: translateY(-6px) scale(1.03); /* поднятие */
      /* box-shadow полностью удалён */
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0,204,255,0.2) 0%, transparent 60%),
                  rgba(255,255,255,0.03);
    }

    /* уголки */
    .module::before, .module::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 25px;
      border: 2px solid #00ccff;
      z-index: 2;
    }
    .module::before { top: 0; left: 0; border-right: none; border-bottom: none; }
    .module::after { bottom: 0; right: 0; border-left: none; border-top: none; }

    .module h3 {
      font-family: 'Orbitron';
      letter-spacing: 3px;
      font-size: 18px;
      transition: 0.3s;
      position: relative;
      z-index: 3;
    }

    .module:hover h3 {
      color: #00ccff;
      text-shadow: 0 0 12px #00ccff;
    }

    /* анимации появления (плавный выезд) */
    .left-start { transform: translateX(-120px); }
    .right-start { transform: translateX(120px); }
    .bottom-start { transform: translateY(60px); }
    .show { transform: translateX(0) translateY(0); opacity: 1; }

    /* ===== GLASS BAR (нижние кнопки с эффектом) ===== */
    .glass-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(10,12,20,0.7);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0,204,255,0.3);
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 -8px 20px rgba(0,0,0,0.5);
      z-index: 20;
    }

    .bar-button {
      position: relative;
      background: rgba(0,204,255,0.15);
      border: 1px solid rgba(0,204,255,0.6);
      border-radius: 30px;
      padding: 6px 18px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(0,204,255,0.5);
      z-index: 1;
      overflow: hidden;
    }

    .bar-button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0,204,255,0.25) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      border-radius: inherit;
      z-index: -1;
    }

    .bar-button:hover::after {
      opacity: 1;
    }

    .bar-button:hover {
      box-shadow: 0 0 25px #00ccff;
      transform: scale(1.05);
    }

    .vertical-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 13px;
    }

    .kapitanych-text {
      font-weight: 600;
      background: linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0,204,255,0.6);
    }

    .multivarka-link {
      position: relative;
      text-decoration: none;
      font-weight: 700;
      background: linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0,204,255,0.6);
      transition: 0.3s;
      z-index: 1;
    }

    .multivarka-link::after {
      content: '';
      position: absolute;
      inset: -4px -8px;
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0,204,255,0.22) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      border-radius: 20px;
      z-index: -1;
    }

    .multivarka-link:hover::after {
      opacity: 1;
    }

    .multivarka-link:hover {
      text-shadow: 0 0 25px #00eaff, 0 0 40px #00ccff;
    }

    /* ===== МОДАЛКА (эффект остаётся) ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: rgba(10,12,20,0.95);
      border: 2px solid #00ccff;
      border-radius: 24px;
      padding: 30px 40px;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 50px #00ccff;
      text-align: center;
      position: relative;
      transform: translateY(40px) scale(0.9);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.2,0.8,0.2,1);
    }
    .modal-overlay.show .modal-content {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .modal-content h2 {
      font-family: 'Orbitron';
      font-size: 26px;
      margin-bottom: 20px;
      background: linear-gradient(45deg,#00ccff,#4fd1ff,#00eaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-content p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #ddd;
    }

    .modal-content p a {
      position: relative;
      color: #00ccff;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      z-index: 1;
    }

    .modal-content p a::after {
      content: '';
      position: absolute;
      inset: -4px -8px;
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0,204,255,0.25) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      border-radius: 30px;
      z-index: -1;
    }

    .modal-content p a:hover::after {
      opacity: 1;
    }

    .modal-button {
      position: relative;
      background: #00ccff;
      border: none;
      border-radius: 40px;
      padding: 10px 25px;
      font-size: 15px;
      font-weight: 600;
      color: #000;
      cursor: pointer;
      transition: 0.3s;
      z-index: 1;
      overflow: hidden;
    }

    .modal-button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.5) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      border-radius: inherit;
      z-index: -1;
    }

    .modal-button:hover::after {
      opacity: 1;
    }

    .modal-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ccff;
      background: #3dd2ff;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 26px;
      cursor: pointer;
      color: #aaa;
      transition: 0.3s;
      z-index: 1;
    }

    .modal-close::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0,204,255,0.25) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      border-radius: 50%;
      z-index: -1;
    }

    .modal-close:hover::after {
      opacity: 1;
    }

    .modal-close:hover {
      color: #00ccff;
    }

    @media (max-width: 700px) {
      .nav { gap: 8px; }
      .nav a { padding: 5px 8px; font-size: 14px; }
      .module { padding: 25px 30px; min-width: 200px; }
    }
  </style>
</head>
<body>

<div class="background"></div>
<div class="grid"></div>

<div class="nav">

  <img src="https://raw.githubusercontent.com/multivarka01/kapitanych/main/avatar.jpg"
       style="width:40px;height:40px;border-radius:50%;border:2px solid #00ccff;box-shadow:0 0 12px #00ccff;object-fit:cover;">

  <span style="font-family:'Orbitron';font-weight:700;letter-spacing:2px;
  background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;">Kapitanych</span>

  <a href="https://donatex.gg/donate/kapitanych" target="_blank">Donatex</a>
  <a href="https://new.donatepay.ru/@Kapitan" target="_blank">DonatPay</a>
  <a href="https://t.me/KapitanGG" target="_blank">Telegram</a>
  <a href="https://discord.com/" target="_blank">Discord</a>
  <a href="https://www.youtube.com/@Капитаныч" target="_blank">YouTube</a>
  <a href="https://www.tiktok.com/@tt_kapitanych" target="_blank">TikTok</a>

  <a href="https://twitch.tv/kapitanych_" target="_blank"
     style="background:#6441a5;padding:8px 16px;border-radius:20px;color:white;">
     Twitch
  </a>

</div>

<section class="hero">
  <img src="https://raw.githubusercontent.com/multivarka01/kapitanych/main/avatar.jpg"
       class="avatar-img"
       onclick="window.open('https://twitch.tv/kapitanych_','_blank')"
       alt="avatar">

  <h1>KAPITANYCH</h1>

  <div class="modules">
    <div class="row">
      <div class="module left-start" id="donatex" onclick="window.open('https://donatex.gg/donate/kapitanych','_blank')"><h3>DONATEX</h3></div>
      <div class="module bottom-start" id="telegram" onclick="window.open('https://t.me/KapitanGG','_blank')"><h3>TELEGRAM</h3></div>
      <div class="module right-start" id="youtube" onclick="window.open('https://www.youtube.com/@Капитаныч','_blank')"><h3>YOUTUBE</h3></div>
    </div>
    <div class="row">
      <div class="module left-start" id="discord" onclick="window.open('https://discord.com/','_blank')"><h3>DISCORD</h3></div>
      <div class="module right-start" id="tiktok" onclick="window.open('https://www.tiktok.com/@tt_kapitanych','_blank')"><h3>TIKTOK</h3></div>
    </div>
  </div>
</section>

<div class="glass-bar">
  <button class="bar-button" onclick="showTwitchModal()">Twitch Sub</button>
  <div class="vertical-block">
    <span class="kapitanych-text">© 2026 Kapitanych</span>
    <a href="https://t.me/multicooker01" target="_blank" class="multivarka-link">MULTIVARKA</a>
  </div>
</div>

<div class="modal-overlay" id="twitchModalOverlay">
  <div class="modal-content">
    <span class="modal-close" onclick="closeTwitchModal()">&times;</span>
    <h2>Подписка на Twitch</h2>
    <p>
      <a href="https://www.twitch.tv/products/kapitanych_" target="_blank">
        Поддержи Twitch своей платной подпиской!
      </a>
    </p>
    <button class="modal-button" onclick="closeTwitchModal()">Закрыть</button>
  </div>
</div>

<script>
  (function() {
    // Анимация появления модулей (плавный выезд)
    window.addEventListener("load", () => {
      setTimeout(() => donatex.classList.add("show"), 200);
      setTimeout(() => youtube.classList.add("show"), 350);
      setTimeout(() => telegram.classList.add("show"), 500);
      setTimeout(() => discord.classList.add("show"), 650);
      setTimeout(() => tiktok.classList.add("show"), 800);
    });

    // Модалка
    window.showTwitchModal = function() {
      document.getElementById("twitchModalOverlay").classList.add("show");
    }
    window.closeTwitchModal = function() {
      document.getElementById("twitchModalOverlay").classList.remove("show");
    }
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeTwitchModal();
    });

    // ===== СЛЕДЯЩЕЕ СВЕЧЕНИЕ ДЛЯ ЦЕНТРАЛЬНЫХ И НИЖНИХ КНОПОК =====
    const interactiveSelector = '.module, .bar-button, .multivarka-link, .modal-button, .modal-close, .modal-content p a';

    document.addEventListener('mousemove', (e) => {
      const target = e.target.closest(interactiveSelector);
      if (!target) return;

      const rect = target.getBoundingClientRect();
      let x = ((e.clientX - rect.left) / rect.width) * 100;
      let y = ((e.clientY - rect.top) / rect.height) * 100;
      x = Math.min(100, Math.max(0, x));
      y = Math.min(100, Math.max(0, y));
      target.style.setProperty('--mouse-x', x + '%');
      target.style.setProperty('--mouse-y', y + '%');
    });

    document.addEventListener('mouseout', (e) => {
      const target = e.target.closest(interactiveSelector);
      if (!target) return;

      const related = e.relatedTarget ? e.relatedTarget.closest(interactiveSelector) : null;
      if (!related) {
        target.style.removeProperty('--mouse-x');
        target.style.removeProperty('--mouse-y');
      }
    });

    document.addEventListener('mouseleave', () => {
      document.querySelectorAll(interactiveSelector).forEach(el => {
        el.style.removeProperty('--mouse-x');
        el.style.removeProperty('--mouse-y');
      });
    });
  })();
</script>
</body>
</html>
