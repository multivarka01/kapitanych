<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitanych · Multivarka</title>

<style>

/* СБРОС */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
background:#06080f;
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
overflow-x:hidden;
}

/* ФОН */
.background{
position:fixed;
inset:0;
z-index:-2;
background:
radial-gradient(circle at 30% 30%,rgba(0,204,255,.12),transparent 60%),
radial-gradient(circle at 70% 70%,rgba(0,150,255,.1),transparent 60%),
#06080f;
}

.grid{
position:fixed;
inset:0;
z-index:-1;
background-image:
linear-gradient(rgba(0,204,255,.12) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,204,255,.12) 1px,transparent 1px);
background-size:50px 50px;
animation:moveGrid 18s linear infinite;
}

@keyframes moveGrid{
0%{transform:translateY(0);}
100%{transform:translateY(50px);}
}

/* НАВИГАЦИЯ */

.nav{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
width:90%;
min-height:65px;
display:flex;
align-items:center;
gap:10px;
background:rgba(30,35,55,.65);
backdrop-filter:blur(18px);
border-radius:20px;
border:1px solid rgba(0,204,255,.25);
padding:0 15px;
z-index:10;
flex-wrap:wrap;
}

.nav-left{display:flex;align-items:center;gap:10px;}

.nav-avatar{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
border:2px solid #00ccff;
box-shadow:0 0 10px #00ccff;
}

.logo-text{
font-weight:700;
font-size:20px;
letter-spacing:2px;
text-shadow:0 0 20px rgba(0,204,255,.6);
}

.nav-links{
display:flex;
gap:12px;
flex-wrap:wrap;
flex:1;
justify-content:center;
}

.nav-links a{
color:white;
font-size:15px;
font-weight:600;
text-decoration:none;
padding:8px 14px;
border-radius:30px;
transition:.2s;
}

.nav-links a:hover{
color:#00ccff;
text-shadow:0 0 12px #00ccff;
}

.nav-right{
margin-left:auto;
display:flex;
gap:10px;
align-items:center;
}

.twitch-btn{
background:linear-gradient(90deg,#6a7cff,#8ea2ff);
padding:8px 18px;
border-radius:30px;
color:white;
font-weight:600;
text-decoration:none;
box-shadow:0 0 15px rgba(120,140,255,.6);
transition:.25s;
border:none;
cursor:pointer;
}

.twitch-btn:hover{
transform:scale(1.05);
}

/* HERO */

.hero{
padding-top:130px;
padding-bottom:90px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
width:100%;
}

.avatar-img{
width:120px;
height:120px;
border-radius:50%;
border:3px solid #00ccff;
box-shadow:0 0 30px #00ccff;
margin-bottom:20px;
object-fit:cover;
cursor:pointer;
}

h1{
font-size:52px;
letter-spacing:4px;
background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* FEED СТИЛЬ */

.modules{
margin-top:60px;
width:100%;
max-width:1100px;
padding:0 20px;
}

.feed-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:24px;
width:100%;
margin-top:40px;
}

/* КАРТОЧКА */

.feed-card{
background:#262626;
border-radius:16px;
border:1px solid rgba(0,204,255,.25);
padding:24px;
min-height:120px;

display:flex;
align-items:center;
justify-content:center;
text-align:center;

cursor:pointer;

transition:transform .2s,box-shadow .2s,border .2s;

opacity:0;
transform:translateY(40px);
}

.feed-card:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(0,204,255,.4);
border:1px solid #00ccff;
}

.feed-card h3{
font-size:18px;
font-weight:700;
letter-spacing:2px;
color:#e0e6ed;
}

.show{
opacity:1;
transform:translateY(0);
}

/* НИЖНЯЯ ПАНЕЛЬ */

.glass-bar{
position:fixed;
bottom:0;
width:100%;
background:rgba(10,12,20,.7);
backdrop-filter:blur(16px);
border-top:1px solid rgba(0,204,255,.3);
padding:10px 15px;
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
}

.bar-button{
background:rgba(0,204,255,.15);
border:1px solid rgba(0,204,255,.6);
border-radius:30px;
padding:6px 18px;
color:white;
font-weight:600;
font-size:13px;
cursor:pointer;
}

.vertical-block{
display:flex;
flex-direction:column;
align-items:center;
font-size:13px;
}

.kapitanych-text{
font-weight:600;
background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.multivarka-link{
text-decoration:none;
font-weight:700;
background:linear-gradient(90deg,#00ccff,#4fd1ff,#00eaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* АДАПТИВ */

@media(max-width:768px){

h1{font-size:38px;}

.feed-grid{
grid-template-columns:1fr;
}

.nav{
width:95%;
}

}

</style>

</head>
