<!DOCTYPE html>

<title>Kapitanych · Multivarka</title>

<script>
async function checkCountry() {
  try {
    const res = await fetch("https://ipwho.is/");
    const data = await res.json();

    if (data && data.country_code === "RU") {
      window.location.replace("http://blocked.mts.ru/");
    }
  } catch (e) {
    console.log("IP check failed");
  }
}

checkCountry();
</script>
