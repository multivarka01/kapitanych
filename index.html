<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapitanych</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: Inter, system-ui;
      background: #06080f;
      color: white;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== PRELOADER ===== */
    #preloader {
      position: fixed;
      inset: 0;
      background: #05070d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .loader-title {
      font-family: Orbitron;
      font-size: 32px;
      letter-spacing: 4px;
      animation: glitch 1.5s infinite;
    }

    .scan-bar {
      margin-top: 25px;
      width: 220px;
      height: 3px;
      background: rgba(168,85,247,0.2);
      overflow: hidden;
      position: relative;
    }

    .scan-bar::after {
      content: "";
      position: absolute;
      height: 100%;
      width: 40%;
      background: #a855f7;
      animation: scan 1.2s infinite;
    }

    @keyframes scan { 0%{ left:-40%; } 100%{ left:100%; } }
    @keyframes glitch {
      0%{ text-shadow:2px 0 #a855f7,-2px 0 #ff00ff; }
      50%{ text-shadow:-2px 0 #a855f7,2px 0 #ff00ff; }
      100%{ text-shadow:2px 0 #a855f7,-2px 0 #ff00ff; }
    }

    /* ===== BACKGROUND ===== */
    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 30% 30%, rgba(168,85,247,0.15), transparent 60%),
        radial-gradient(circle at 70% 70%, rgba(255,0,255,0.1), transparent 60%),
        #06080f;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(168,85,247,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: moveGrid 20s linear infinite;
      z-index: -1;
    }

    @keyframes moveGrid { 0%{ transform:translateY(0); } 100%{ transform:translateY(60px); } }

    /* ===== NAV ===== */
    .nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 35px;
      background: rgba(10,12,20,0.6);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      z-index: 10;
    }

    .nav a {
      color: #aaa;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .nav a:hover { color:#a855f7; text-shadow:0 0 12px #a855f7; }

    /* ===== HERO ===== */
    .hero {
      flex: 1;
      padding-top: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: 1s ease;
    }

    .hero.show { opacity:1; transform:translateY(0); }

    /* ===== АВАТАР ===== */
    .avatar-placeholder {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(168,85,247,0.1);
      border: 3px solid #a855f7;
      box-shadow: 0 0 30px #a855f7;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 60px;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 20px #a855f7;
      transition: 0.4s;
      cursor: pointer;
    }

    .avatar-placeholder:hover { transform:scale(1.08); box-shadow:0 0 60px #a855f7; }

    h1 { font-family:Orbitron; font-size:52px; letter-spacing:4px; }

    /* ===== MODULES ===== */
    .modules { margin-top:60px; display:flex; flex-direction:column; gap:30px; }
    .row { display:flex; gap:25px; justify-content:center; flex-wrap:wrap; }
    .module {
      position:relative; padding:35px 45px; min-width:260px;
      background:rgba(255,255,255,0.03); border:1px solid rgba(168,85,247,0.4);
      border-radius:16px; backdrop-filter:blur(10px); transition:0.4s; cursor:pointer;
      overflow:hidden;
    }
    .module::before, .module::after {
      content:""; position:absolute; width:25px; height:25px; border:2px solid #a855f7;
    }
    .module::before { top:0; left:0; border-right:none; border-bottom:none; }
    .module::after { bottom:0; right:0; border-left:none; border-top:none; }
    .module h3 { font-family:Orbitron; letter-spacing:3px; font-size:18px; }
    .module:hover { transform:translateY(-6px) scale(1.03); box-shadow:0 0 40px rgba(168,85,247,.7); }

    /* ===== СТЕКЛЯННЫЙ БАР ===== */
    .glass-bar {
      width: 100%;
      background: rgba(10,12,20,0.7);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(168,85,247,0.3);
      padding: 24px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 20px 30px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
      font-size: 15px;
    }

    /* Все надписи в баре НЕКЛИКАБЕЛЬНЫ */
    .glass-bar .bar-label {
      color: #ccc;
      font-weight: 500;
      letter-spacing: 0.5px;
      pointer-events: none;
      cursor: default;
      border-bottom: none;
      transition: none;
    }
    .glass-bar .bar-label:hover {
      color: #ccc;
      border-bottom-color: transparent;
      text-shadow: none;
    }

    .vertical-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.3;
      margin: 0 10px;
      text-align: center;
    }
    .vertical-block .bar-label { font-weight: 600; border-bottom: none; }

    /* Кнопки остаются активными */
    .bar-button {
      background: rgba(168,85,247,0.15);
      border: 1px solid rgba(168,85,247,0.5);
      border-radius: 30px;
      padding: 8px 22px;
      color: white;
      font-family: Inter, sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 10px rgba(168,85,247,0.2);
      white-space: nowrap;
    }
    .bar-button:hover {
      background: rgba(168,85,247,0.3);
      border-color: #a855f7;
      box-shadow: 0 0 20px #a855f7;
      transform: scale(1.05);
    }

    /* ===== КАСТОМНОЕ МОДАЛЬНОЕ ОКНО ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: rgba(10,12,20,0.95);
      border: 2px solid #a855f7;
      border-radius: 24px;
      padding: 30px 40px;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 50px #a855f7;
      text-align: center;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.show .modal-content {
      transform: scale(1);
    }

    .modal-content h2 {
      font-family: Orbitron;
      font-size: 28px;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #a855f7, #ff00ff, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(168,85,247,0.7);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px #a855f7, 0 0 20px #ff00ff; }
      100% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ccff; }
    }

    .modal-content p {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 25px;
      color: #ddd;
    }

    .modal-content a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      background: linear-gradient(45deg, #a855f7, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
    }

    .modal-content a:hover {
      border-bottom-color: #a855f7;
      text-shadow: 0 0 15px #a855f7;
    }

    .clickable-hint {
      font-size: 14px;
      color: #aaa;
      margin-left: 5px;
      font-style: italic;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
      color: #aaa;
      transition: 0.2s;
      line-height: 1;
    }

    .modal-close:hover {
      color: #a855f7;
      text-shadow: 0 0 10px #a855f7;
    }

    .modal-button {
      background: rgba(168,85,247,0.2);
      border: 1px solid #a855f7;
      border-radius: 40px;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .modal-button:hover {
      background: #a855f7;
      color: #000;
      box-shadow: 0 0 20px #a855f7;
    }

    /* мобильная адаптация */
    @media (max-width: 768px) {
      h1 { font-size:34px; }
      .module { min-width:220px; }
      .glass-bar {
        flex-direction: column;
        align-items: center;
        gap: 15px;
        padding: 20px 15px;
      }
      .bar-button { padding:6px 18px; }
      .vertical-block { margin:5px 0; }
      .modal-content { padding: 25px 20px; }
      .modal-content h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
<div id="preloader"><div class="loader-title">INITIALIZING</div><div class="scan-bar"></div></div>
<div class="background"></div><div class="grid"></div>

<div class="nav">
  <a href="https://donatex.gg/donate/kapitanych" target="_blank">Donatex</a>
  <a href="https://new.donatepay.ru/@Kapitan" target="_blank">DonatPay</a>
  <a href="https://t.me/KapitanGG" target="_blank">Telegram</a>
  <a href="https://discord.com/" target="_blank">Discord</a>
  <a href="https://www.youtube.com/@Капитаныч" target="_blank">YouTube</a>
  <a href="https://www.tiktok.com/@tt_kapitanych" target="_blank">TikTok</a>
</div>

<section class="hero" id="hero">
  <div class="avatar-placeholder" onclick="window.open('https://twitch.tv/kapitanych_','_blank')">K</div>
  <h1>KAPITANYCH</h1>
  <div class="modules">
    <div class="row">
      <div class="module" onclick="window.open('https://donatex.gg/donate/kapitanych','_blank')"><h3>DONATEX</h3></div>
      <div class="module" onclick="window.open('https://t.me/KapitanGG','_blank')"><h3>TELEGRAM</h3></div>
      <div class="module" onclick="window.open('https://www.youtube.com/@Капитаныч','_blank')"><h3>YOUTUBE</h3></div>
    </div>
    <div class="row">
      <div class="module" onclick="window.open('https://discord.com/','_blank')"><h3>DISCORD</h3></div>
      <div class="module" onclick="window.open('https://www.tiktok.com/@tt_kapitanych','_blank')"><h3>TIKTOK</h3></div>
    </div>
  </div>
</section>

<!-- Стеклянный бар -->
<div class="glass-bar">
  <!-- Левая кнопка Soon... 1 теперь открывает модальное окно "Скоро..." -->
  <button class="bar-button" onclick="showSoonModal()">Soon...</button>
  <div class="vertical-block" style="opacity:0.4;">
    <span class="bar-label">© 2026 Kapitanych</span>
    <span class="bar-label">MULTIVARKA</span>
  </div>
  <button class="bar-button" onclick="showTwitchModal()">Twitch Sub</button>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ TWITCH SUB -->
<div class="modal-overlay" id="twitchModalOverlay" onclick="closeTwitchModal(event)">
  <div class="modal-content">
    <span class="modal-close" onclick="closeTwitchModal(event)">&times;</span>
    <h2>Подписка на Twitch</h2>
    <p>
      <a href="https://www.twitch.tv/products/kapitanych_" target="_blank">
        Поддержи Twitch своей платной подпиской!
      </a>
      <span class="clickable-hint">*кликабельно*</span>
    </p>
    <button class="modal-button" onclick="closeTwitchModal()">Закрыть</button>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ SOON... -->
<div class="modal-overlay" id="soonModalOverlay" onclick="closeSoonModal(event)">
  <div class="modal-content">
    <span class="modal-close" onclick="closeSoonModal(event)">&times;</span>
    <h2>Скоро...</h2>
    <p>Функция в разработке</p>
    <p style="font-size: 24px; font-weight: bold; color: #a855f7;">Soon...</p>
    <button class="modal-button" onclick="closeSoonModal()">Закрыть</button>
  </div>
</div>

<script>
// Функции для модального окна Twitch
function showTwitchModal() {
  document.getElementById('twitchModalOverlay').classList.add('show');
}

function closeTwitchModal(event) {
  const modal = document.getElementById('twitchModalOverlay');
  modal.classList.remove('show');
}

// Функции для модального окна Soon
function showSoonModal() {
  document.getElementById('soonModalOverlay').classList.add('show');
}

function closeSoonModal(event) {
  const modal = document.getElementById('soonModalOverlay');
  modal.classList.remove('show');
}

// Закрытие всех модальных окон по Escape
function closeAllModals() {
  document.querySelectorAll('.modal-overlay').forEach(modal => {
    modal.classList.remove('show');
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeAllModals();
  }
});

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("preloader").style.opacity="0";
    document.getElementById("preloader").style.visibility="hidden";
    document.getElementById("hero").classList.add("show");
  },1500);
});
</script>
</body>
</html>
