<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Поздравления | Kapitanych & Sergeevna</title>
    <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #202020;
            font-family: 'Handjet', monospace;
            font-weight: 600;
            letter-spacing: 0.02em;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 2.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff3a3a, #8b0000);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .hero p {
            font-size: 1.2rem;
            color: #b6c6e3;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .congrats-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .congrat-card {
            background: #2a2a2a;
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, border-color 0.2s;
        }
        .congrat-card:hover {
            transform: translateY(-3px);
            border-color: #789d2a;
        }

        .avatar {
            width: 70px;
            height: 70px;
            margin: 0 auto 0.8rem;
            border-radius: 50%;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .avatar i {
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .nickname {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #ff9a3a, #ff3a3a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-bubble {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            line-height: 1.45;
            color: #e0e0e0;
            text-align: center;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-wrapper {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0 2rem;
        }
        .toggle-btn {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 60px;
            padding: 0.6rem 1.5rem;
            font-family: 'Handjet', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            color: #b6c6e3;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: #789d2a;
            border-color: #8fb33e;
            color: white;
            box-shadow: 0 0 10px rgba(120, 157, 42, 0.3);
        }
        .toggle-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #789d2a;
            color: white;
        }
        .toggle-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #3a3a3a;
            border-color: #555;
            color: #aaa;
        }

        .back-link {
            display: inline-block;
            margin-top: 0.5rem;
            text-align: center;
            width: 100%;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            color: #b6c6e3;
            transition: 0.2s;
        }
        .back-link i {
            margin-right: 6px;
        }
        .back-link:hover {
            color: #789d2a;
        }

        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #8a8a8a;
        }
        .fa-heart {
            color: #ff6a6a;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #2a2a2a;
            border-radius: 48px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 2px solid #ff3a3a;
            box-shadow: 0 0 30px rgba(255, 58, 58, 0.5);
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-content h2 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff3a3a, #ff9a3a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }
        .modal-close {
            float: right;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            color: #b6c6e3;
            transition: 0.2s;
        }
        .modal-close:hover {
            color: #ff3a3a;
        }
        .modal-audio {
            width: 100%;
            margin: 1rem 0;
            border-radius: 40px;
            background: #1e1e1e;
        }
        @media (max-width: 550px) {
            .modal-content { padding: 1.5rem; }
            .modal-content h2 { font-size: 1.6rem; }
        }

        /* Canvas для конфетти */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>

<div class="container">
    <div class="hero">
        <h1>⚡ ПОЗДРАВЛЕНИЯ ⚡</h1>
        <p>Тёплые слова от друзей и команды</p>
    </div>

    <div id="congrats-container" class="congrats-grid"></div>

    <div class="toggle-wrapper">
        <button class="toggle-btn active" data-person="kapitanych">Kapitanych</button>
        <button id="songBtn" class="toggle-btn" disabled>🎵 Песня</button>
        <button class="toggle-btn" data-person="sergeevna">Sergeevna</button>
    </div>

    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Вернуться на главную</a>
    <footer>
        <i class="fas fa-heart"></i> С любовью от сообщества Kapitanych <i class="fas fa-heart"></i>
    </footer>
</div>

<!-- Модальное окно -->
<div id="musicModal" class="modal">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h2>🎉 С ДНЁМ РОЖДЕНИЯ! 🎉</h2>
        <audio id="modalAudio" class="modal-audio" controls loop>
            <source src="birthday.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудио.
        </audio>
        <p style="margin-top: 1rem; color: #b6c6e3;">✨ Пусть этот день будет волшебным! ✨</p>
    </div>
</div>

<script>
    // Данные поздравлений (7 и 7)
    const persons = {
        kapitanych: [
            { nickname: "TheMultivarka", icon: "fa-code", iconColor: "#A3FFD6", message: "Капитан, с днём рождения! 🎉 Спасибо тебе за этот вайб, за твои бесконечные приключения в играх. Ты реально заряжаешь энергией. Пусть всё, что задумал, сбудется, а стримы будут ещё круче! ❤️" },
            { nickname: "Sergeevna", icon: "fa-user-astronaut", iconColor: "#A3FFD6", message: "Капитаныч, с днём варенья! 😊 Ты — космос! Серьёзно, без твоих стримов вечера были бы скучными. Спасибо, что делишься своим настроением. Желаю тебе гору денег, здоровье и чтобы чат всегда радовал! 🚀" },
            { nickname: "EvgeniaVladimirovn_a", icon: "fa-feather-alt", iconColor: "#B5E3FF", message: "От всего сердца поздравляю тебя с днем рождения! Желаю, чтобы жизнь радовала тебя каждый день: пусть рядом будут любящие люди, в душе — гармония, а в сердце — радость. Крепкого здоровья, неиссякаемого оптимизма и исполнения самых заветных желаний! Пусть каждый новый день приносит что‑то хорошее: тёплые встречи, приятные сюрпризы и поводы для улыбки. Будь счастлив и береги себя!" },
            { nickname: "Mimik58pro", icon: "fa-cat", iconColor: "#FDFFAB", message: "Капитан, с днём рождения! 🎂 Твои стримы — это как котики: тёплые, уютные и непредсказуемые 😄 Желаю тебе океан лайков, море донатов и чтобы ни один баг не испортил настроение. Обнимаю! 🐾" },
            { nickname: "Mn1x_code002", icon: "fa-code", iconColor: "#C0A5FF", message: "С днём рождения, Капитан! 🖥️ Желаю тебе меньше дебаггинга в жизни, больше профита и чтобы код всегда компилился с первого раза. Ты — легенда, продолжай в том же духе! ⚡" },
            { nickname: "Kaiser", icon: "fa-crosshairs", iconColor: "#B5E3FF", message: "Капитан, с днём рождения! 🔥 Ты — настоящий охотник за эмоциями зрителей. Пусть твои хайлайты собирают миллионы, а в жизни будет всё, о чём мечтаешь. С тобой весело, спасибо за это! 🎯" },
            { nickname: "Fasder", icon: "fa-mask", iconColor: "#FFB3BA", message: "С днём рождения, Капитан! ✨ Ты как шаман: создаёшь магию из ничего. Пусть твоя энергия никогда не иссякает, а чат всегда поддерживает. Оставайся таким же живым и искренним! 🌀" }
        ],
        sergeevna: [
            { nickname: "TheMultivarka", icon: "fa-sun", iconColor: "#FFE6B0", message: "Сергеевна, с днём рождения! 💐 Вы — как солнышко, которое согревает всех вокруг. Спасибо за вашу доброту и заботу. Желаю вам здоровья, улыбок и чтобы каждый день приносил радость! 🌞" },
            { nickname: "Kapitanych", icon: "fa-cookie-bite", iconColor: "#FDFFAB", message: "Сергеевна, с днём рождения! 🍯 Вы — самая сладкая и уютная часть нашего сообщества. Пусть у вас всегда будет время на отдых, вкусный чай и приятные хлопоты. Люблю вас! 🫖" },
            { nickname: "EvgeniaVladimirovn_a", icon: "fa-feather-alt", iconColor: "#B5E3FF", message: "От всего сердца поздравляю Вас с днем рождения! Желаю, чтобы жизнь радовала Вас каждый день: пусть рядом будут любящие люди, в душе — гармония, а в сердце — радость. Крепкого здоровья, неиссякаемого оптимизма и исполнения самых заветных желаний! Пусть каждый новый день приносит что‑то хорошее: тёплые встречи, приятные сюрпризы и поводы для улыбки. Будьте счастливы и берегите себя!" },
            { nickname: "Mimik58pro", icon: "fa-bear", iconColor: "#FFB48A", message: "Сергеевна, с днём рождения! 🐻 Вы — наша медведица-защитница. Желаю вам, чтобы всё плохое обходило стороной, а хорошее лилось рекой. Спасибо за вашу заботу! 🎂" },
            { nickname: "Mn1x_code002", icon: "fa-code", iconColor: "#C0A5FF", message: "С днём рождения, Сергеевна! 🖥️ Желаю вам меньше дебаггинга в жизни, больше профита и чтобы код всегда компилился с первого раза. Вы — легенда! Продолжайте в том же духе! ⚡" },
            { nickname: "Kaiser", icon: "fa-sparkles", iconColor: "#C0A5FF", message: "Сергеевна, с днём рождения! ✨ Вы как звёздочка — светите ярко, но мягко. Желаю вам исполнения желаний, семейного тепла и чтобы каждый день был наполнен счастьем! 🌙" },
            { nickname: "Fasder", icon: "fa-hand-sparkles", iconColor: "#FFB3BA", message: "Сергеевна, с днём рождения! 🌸 Вы — душа нашего маленького мира. Пусть жизнь дарит вам только приятные сюрпризы, а близкие окружают любовью. Крепкого здоровья и много улыбок! 💫" }
        ]
    };

    // DOM элементы
    const container = document.getElementById('congrats-container');
    const songBtn = document.getElementById('songBtn');
    const modal = document.getElementById('musicModal');
    const modalAudio = document.getElementById('modalAudio');
    const modalClose = document.querySelector('.modal-close');
    let currentPerson = 'kapitanych';

    // --- Конфетти (простая анимация на canvas) ---
    const canvas = document.getElementById('confettiCanvas');
    let ctx = canvas.getContext('2d');
    let particles = [];
    let animationId = null;
    let confettiActive = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function createParticle(x, y) {
        return {
            x: x,
            y: y,
            size: Math.random() * 8 + 4,
            speedX: (Math.random() - 0.5) * 8,
            speedY: Math.random() * 10 + 5,
            color: `hsl(${Math.random() * 360}, 80%, 60%)`,
            rotation: Math.random() * 360,
            spin: (Math.random() - 0.5) * 10,
            life: 1,
            fade: 0.02 + Math.random() * 0.03
        };
    }

    function startConfetti() {
        if (animationId) cancelAnimationFrame(animationId);
        particles = [];
        confettiActive = true;
        resizeCanvas();

        // Создаём 200 частиц, разбросанных по верхней половине экрана
        for (let i = 0; i < 200; i++) {
            particles.push(createParticle(
                Math.random() * canvas.width,
                Math.random() * canvas.height * 0.5
            ));
        }

        function draw() {
            if (!confettiActive) return;
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let allDead = true;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                if (p.life <= 0) continue;
                allDead = false;
                p.x += p.speedX;
                p.y += p.speedY;
                p.speedY += 0.2; // гравитация
                p.life -= p.fade;
                p.rotation += p.spin;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();
            }
            if (allDead) {
                cancelAnimationFrame(animationId);
                animationId = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                confettiActive = false;
                return;
            }
            animationId = requestAnimationFrame(draw);
        }
        draw();
        // Автоматически остановить конфетти через 5 секунд
        setTimeout(() => {
            if (confettiActive) {
                confettiActive = false;
                if (animationId) cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }, 5000);
    }

    // --- Модальное окно с музыкой ---
    function openModal() {
        modal.style.display = 'flex';
        modalAudio.play().catch(e => console.log('Автовоспроизведение заблокировано'));
        startConfetti();
    }
    function closeModal() {
        modal.style.display = 'none';
        modalAudio.pause();
        modalAudio.currentTime = 0;
        // Останавливаем конфетти
        if (confettiActive) {
            confettiActive = false;
            if (animationId) cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }
    modalClose.addEventListener('click', closeModal);
    window.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    // --- Рендер карточек ---
    function render(personKey) {
        const data = persons[personKey];
        if (!data) return;
        container.innerHTML = '';
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'congrat-card';
            card.innerHTML = `
                <div class="avatar">
                    <i class="fas ${p.icon}" style="color: ${p.iconColor};"></i>
                </div>
                <div class="nickname">
                    <i class="fas fa-star"></i> ${p.nickname}
                </div>
                <div class="message-bubble">
                    ${p.message}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- Управление активностью кнопки "Песня" ---
    function updateSongButton() {
        if (currentPerson === 'sergeevna') {
            songBtn.disabled = false;
        } else {
            songBtn.disabled = true;
            // Если модалка открыта, закрываем её при переключении
            if (modal.style.display === 'flex') closeModal();
        }
    }

    // Обработка клика по кнопке "Песня"
    songBtn.addEventListener('click', () => {
        if (!songBtn.disabled) {
            openModal();
        }
    });

    // --- Переключение между Kapitanych и Sergeevna ---
    const btns = document.querySelectorAll('.toggle-btn[data-person]');
    function setActive(person) {
        btns.forEach(btn => {
            const val = btn.getAttribute('data-person');
            if (val === person) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        currentPerson = person;
        render(person);
        updateSongButton();
    }

    btns.forEach(btn => {
        btn.addEventListener('click', () => {
            const person = btn.getAttribute('data-person');
            if (person === currentPerson) return;
            setActive(person);
        });
    });

    // Инициализация
    setActive('kapitanych');
    resizeCanvas();
</script>
</body>
</html>
